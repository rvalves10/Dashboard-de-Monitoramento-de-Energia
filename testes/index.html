<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes Solaris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Mesmos tokens do site (site/css/base.css). Se a paleta mudar la,
   mude aqui tambem - esta pagina nao carrega o CSS do site de proposito,
   para um erro de estilo nunca derrubar a suite. */
:root{
  --ground:#F4F5F7;--surface:#fff;--ink:#15181C;--muted:#4C535B;--line:#DCDFE4;
  --good:#0F6B47;--good-bg:#E8F3ED;--bad:#AE3F27;--bad-bg:#FBEDE9;--sun:#D97706;
}
*{box-sizing:border-box}
body{
  margin:0;padding:40px 24px 80px;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;
}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.033em;margin:0}
.sub{color:var(--muted);margin:8px 0 26px;font-size:15px;max-width:70ch}
.resumo{
  border-radius:14px;padding:16px 20px;font-size:17px;margin-bottom:26px;
  border:1px solid var(--line);background:var(--surface);
}
.resumo b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
.resumo.bom{background:var(--good-bg);border-color:#C6E0D3;color:#0F6B47}
.resumo.ruim{background:var(--bad-bg);border-color:#F0D3C9;color:#8A3320}
.resumo span{font-weight:600}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
h2{
  font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;margin:0 0 10px;
  display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em;
}
h2 span{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:400;color:var(--muted)}
.caso{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px}
.marca{font-family:'IBM Plex Mono',monospace;flex-shrink:0;width:14px;font-weight:500}
.caso.ok .marca{color:var(--good)}
.caso.falhou{color:var(--bad);font-weight:500}
.caso.falhou .marca{color:var(--bad)}
.caso em{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:12px;
  color:#8A3320;background:var(--bad-bg);padding:6px 9px;border-radius:7px;margin-top:5px}
footer{margin-top:26px;color:var(--muted);font-size:13px}
code{font-family:'IBM Plex Mono',monospace;background:var(--ground);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Testes do motor</h1>
  <p class="sub">Suíte do Solaris. Roda direto no navegador, sem instalar nada — se algo ficar vermelho, não abra pull request.</p>
  <div id="saida"></div>
  <footer>Para rodar de novo, recarregue a página. Os testes ficam em <code>testes/testes.js</code>.</footer>
</div>

<!-- Carrega tudo com um carimbo de tempo: a suite nunca deve rodar
     contra codigo em cache. Sequencial, porque a ordem importa. -->
<script>
(function () {
  var v = '?t=' + Date.now();
  var arquivos = [
    '../site/js/banco.js', '../site/js/motor.js', '../site/js/login.js',
    '../site/js/telas.js', '../site/js/movel.js', '../site/js/controle.js', 'testes.js'
  ];
  (function proximo(i) {
    if (i >= arquivos.length) return;
    var s = document.createElement('script');
    s.src = arquivos[i] + v;
    s.onload = function () { proximo(i + 1); };
    s.onerror = function () {
      document.getElementById('saida').innerHTML =
        '<div class="resumo ruim">Nao consegui carregar <b>' + arquivos[i] + '</b></div>';
    };
    document.body.appendChild(s);
  })(0);
})();
</script>
</body>
</html>
