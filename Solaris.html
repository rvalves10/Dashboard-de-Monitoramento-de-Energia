<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solaris — monitoramento de energia solar</title>
<meta name="description" content="Painel que mostra para onde vai cada quilowatt da sua casa ou do seu comércio, quanto o sol cobriu e quanto vem na próxima conta.">
<meta name="theme-color" content="#16150F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%20%20%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%2316150F%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2215%22%20fill%3D%22none%22%20stroke%3D%22%23EDA22B%22%20stroke-width%3D%224.5%22%2F%3E%0A%20%20%3Cg%20stroke%3D%22%23F5C25B%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M50%2023v7M50%2070v7M77%2050h-7M30%2050h-7M69%2031l-5%205M36%2064l-5%205M69%2069l-5-5M36%2036l-5-5%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A">
<style>
/* ===== css/base.css ===== */
/* base.css
   Cores, tipografia, reset e utilitarios. Tudo que o resto herda.
   Parte do sistema de design do Solaris. A ordem em que os arquivos
   de CSS entram no index.html importa: base, componentes, telas,
   responsivo e impressao, nessa sequencia. */

/* ============================================================
   SOLARIS - sistema de design
   Editorial claro. Papel neutro frio, tinta quase preta, e o ambar
   com um trabalho definido.

   A regra que sustenta o resto: DENTRO DE UM GRAFICO OU DE UM DADO,
   ambar significa energia que veio do sol e azul-ardosia significa
   energia comprada da rede. Nenhuma outra serie pode ser ambar - se um
   aparelho fosse ambar, a barra de consumo pareceria falar do sol.

   Fora dos dados, o ambar e a cor da marca: o simbolo, o marcador de
   pagina no menu e o botao de entrar sem conta. Sao dois papeis, e eles
   nao se misturam na mesma peca.
   ============================================================ */
:root{
  /* --- neutros ---
     Rampa fria de proposito. O bege quente que estava aqui e o fundo
     padrao de interface gerada por IA; trocamos por um cinza neutro
     que nao tenta parecer sofisticado sozinho. */
  --n-0:#FFFFFF;
  --n-25:#FBFBFC;
  --n-50:#F4F5F7;
  --n-100:#EBEDF0;
  --n-200:#DCDFE4;
  --n-300:#C2C7CE;
  --n-400:#98A0A9;
  --n-500:#6C747D;
  --n-600:#4C535B;
  --n-700:#343A41;
  --n-800:#22262B;
  --n-900:#15181C;

  --ground:var(--n-50);
  --ground-2:var(--n-100);
  --surface:var(--n-0);
  --dark:var(--n-900);
  --dark-2:var(--n-800);

  /* --- tinta ---
     Quatro degraus, cada um com um trabalho. Todos passam em AA
     sobre --surface e sobre --ground. */
  --ink:var(--n-900);      /* titulo e numero */
  --ink-2:var(--n-700);    /* corpo */
  --muted:var(--n-600);    /* apoio, 7.3:1 no branco */
  --faint:var(--n-500);    /* rotulo secundario, 4.9:1 no branco */
  --fainter:var(--n-500);  /* mantido como apelido: nada desce abaixo de 4.5:1 */

  --line:var(--n-200);
  --line-2:var(--n-300);

  --on-dark:#F2F4F6;
  --on-dark-soft:#B6BDC5;   /* 7.1:1 sobre --dark */
  --on-dark-faint:#949CA5;  /* 4.9:1 sobre --dark  */

  /* --- sol: geracao solar, e nada mais ---
     --sun preenche (barra, area, ponto). --sun-ink escreve, porque
     precisa de 4.5:1 no branco e o ambar de preenchimento nao tem. */
  --sun:#D97706;
  --sun-lite:#F0A93C;
  --sun-ink:#9A5308;
  --sun-deep:#9A5308;
  --sun-deeper:#7A4106;
  --sun-wash:#FDF3E4;
  --sun-line:#F0DCBE;

  /* --- rede: energia comprada da distribuidora --- */
  --grid:#33507C;
  --grid-lite:#5B7BAC;
  --grid-wash:#EDF1F7;

  /* --- estados --- */
  --good:#0F6B47;
  --good-soft:#7FB99E;
  --good-bg:#E8F3ED;
  --good-line:#C6E0D3;
  --good-on-dark:#5FCA9A;
  --warn:#8A5A00;
  --warn-bg:#FBF1DC;
  --warn-line:#EEDCB4;
  --bad:#AE3F27;
  --bad-soft:#DDA294;
  --bad-bg:#FBEDE9;
  --bad-line:#F0D3C9;
  --violet:#6B5FA0;
  --teal:#2F7D95;

  /* --- forma ---
     Cartao para em 14px. Acima disso tudo vira o mesmo borrao macio,
     e a interface perde a cara de instrumento de medicao. Pilula fica
     reservada para etiqueta e botao pequeno. */
  --r-lg:14px; --r-md:10px; --r-sm:8px; --r-xs:6px; --r-pill:999px;

  /* --- ritmo ---
     Oito degraus. O que da ritmo nao e usar todos: e usar os curtos
     dentro de um grupo e os longos entre secoes. */
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:20px;
  --e6:28px; --e7:40px; --e8:56px;

  /* --- tipografia ---
     Corpo em 15px com entrelinha 1.6: o texto e para ler, nao para
     caber. Os degraus grandes sobem a ~1.28 cada, o suficiente para
     a hierarquia se ver sem precisar de peso extra. */
  --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:17px;
  --t-lg:21px; --t-xl:27px; --t-2xl:34px; --t-3xl:44px; --t-4xl:60px;

  --lh-tight:1.15;
  --lh-snug:1.35;
  --lh-body:1.6;

  /* --- movimento ---
     Uma curva so, sempre saindo. Nada de mola nem repique: isto e um
     painel de medicao, nao um brinquedo. */
  --curva:cubic-bezier(.32,.72,0,1);
  --curva-saida:cubic-bezier(.32,.72,0,1);

  /* --- elevacao ---
     A borda define a peca; a sombra so aparece em coisa que flutua de
     verdade (aviso, dica, menu). Cartao encostado no papel nao ganha
     sombra e borda ao mesmo tempo - essa combinacao e a assinatura
     mais reconhecivel de tela gerada por maquina. */
  --elev-flutua:0 8px 24px -8px rgba(21,24,28,.18), 0 2px 6px -2px rgba(21,24,28,.10);
  --elev-alto:0 18px 42px -14px rgba(21,24,28,.30);
  --anel-foco:0 0 0 3px rgba(217,119,6,.28);

  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Sem isto o navegador escolhe sozinho como pintar controle nativo, e num
   sistema em modo escuro a trilha do slider vem quase preta no meio de um
   cartao branco. O site tem um tema so: declarado, nao adivinhado. */
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{
  background:var(--ground);color:var(--ink-2);
  font-family:var(--f-body);font-size:var(--t-base);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);color:var(--ink);text-wrap:balance;line-height:var(--lh-tight)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none !important}

/* So aparece quando a navegacao e por teclado - quem usa mouse nao ve. */
:focus-visible{outline:2px solid var(--sun-ink);outline-offset:2px;border-radius:var(--r-xs)}

::selection{background:rgba(217,119,6,.22);color:var(--ink)}

.pular{
  position:absolute;left:12px;top:-64px;z-index:300;
  background:var(--dark);color:var(--on-dark);padding:11px 18px;border-radius:var(--r-md);
  font-size:var(--t-sm);font-weight:600;text-decoration:none;transition:top .18s var(--curva);
}
.pular:focus{top:12px}
#conteudo:focus{outline:none}
.chart:focus-visible,.hbars:focus-visible{outline:2px solid var(--sun-ink);outline-offset:4px;border-radius:var(--r-sm)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--n-300);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--n-400);background-clip:content-box}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* Rotulo de coluna e de campo. Nao e chapeu de titulo: e etiqueta de
   dado, sempre colada no que ela nomeia. O caixa-alta so vale porque
   o texto e curto - paragrafo em maiuscula ninguem le. */
.rotulo{
  font-size:var(--t-xs);font-weight:600;color:var(--faint);
  letter-spacing:.04em;text-transform:uppercase;line-height:var(--lh-snug);
}
.rotulo-lc{font-size:var(--t-xs);font-weight:600;color:var(--faint);line-height:var(--lh-snug)}

/* Largura de leitura. Linha acima de ~75 caracteres faz o olho perder
   o comeco da proxima. */
.prosa{max-width:70ch}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.sem-js{max-width:65ch;margin:12vh auto;padding:0 24px}
.sem-js h1{font-size:var(--t-xl);letter-spacing:-.02em;margin:0 0 12px}
.sem-js p{line-height:var(--lh-body);color:var(--muted)}


/* ===== css/componentes.css ===== */
/* componentes.css
   Pecas reaproveitadas: menu, cartoes, botoes, formularios, avisos.
   Parte do sistema de design do Solaris. A ordem em que os arquivos
   de CSS entram no index.html importa: base, componentes, telas,
   responsivo e impressao, nessa sequencia. */

/* ---------- casca ---------- */
.app{display:flex;min-height:100vh;background:var(--ground)}

/* O menu lateral fica fixo enquanto o conteudo rola. Escuro chapado:
   a separacao vem de uma linha, nao de degrade nem de sombra difusa. */
.rail{
  width:240px;flex-shrink:0;color:var(--on-dark);
  background:var(--dark);
  border-right:1px solid #000;
  display:flex;flex-direction:column;padding:var(--e5) 0 var(--e4);
  position:sticky;top:0;height:100vh;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 var(--e5) var(--e6)}
.brand-mark{
  width:32px;height:32px;border-radius:var(--r-sm);flex-shrink:0;
  background:var(--sun);color:var(--dark);
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:var(--t-lg);letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:var(--t-xs);color:var(--on-dark-faint);margin-top:2px;line-height:1.2}

.nav{display:flex;flex-direction:column;gap:1px;padding:0 var(--e3)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;position:relative;
  padding:9px var(--e3);border-radius:var(--r-sm);
  font-size:var(--t-sm);font-weight:500;
  color:var(--on-dark-soft);transition:background .14s var(--curva),color .14s var(--curva);
}
.nav-item:hover{background:rgba(242,244,246,.07);color:var(--on-dark)}
.nav-item[aria-current="page"]{background:rgba(242,244,246,.10);color:var(--on-dark);font-weight:600}
/* Marcador de navegacao: diz em que pagina voce esta. E o unico lugar
   do sistema onde uma barra colorida na lateral tem funcao. */
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:calc(var(--e3) * -1);top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--sun);
}
.nav-item svg{flex-shrink:0}
.nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  background:var(--bad);color:#fff;font-size:var(--t-xs);font-weight:700;min-width:19px;height:19px;
  border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;
}

.rail-spacer{flex:1;min-height:var(--e4)}
.rail-foot{padding:0 var(--e3);display:flex;flex-direction:column;gap:var(--e2)}
.unitbox{border:1px solid rgba(242,244,246,.13);border-radius:var(--r-md);padding:var(--e3)}
.unitbox-title{font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-dark-faint);margin-bottom:var(--e2)}
.unit{display:flex;align-items:center;gap:var(--e2);width:100%;padding:7px var(--e2);border-radius:var(--r-xs);color:var(--on-dark-soft);transition:background .14s var(--curva)}
.unit:hover{background:rgba(242,244,246,.09)}
.unit[aria-pressed="true"]{background:rgba(242,244,246,.12);color:var(--on-dark)}
.unit-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--n-600)}
.unit[aria-pressed="true"] .unit-dot{background:var(--sun)}
.unit-name{font-size:var(--t-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-type{font-size:var(--t-xs);color:var(--on-dark-faint)}

/* O medidor do menu: o unico bloco do site que muda sozinho. */
.meter{border:1px solid rgba(242,244,246,.13);border-radius:var(--r-md);padding:var(--e3)}
.meter-head{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-dark-faint)}
/* Pisca porque o numero ao lado esta mesmo trocando a cada 2 segundos.
   Se o medidor parar, controle.js tira a classe e o ponto congela. */
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good-on-dark);flex-shrink:0}
.live-dot.batendo{animation:beat 2s var(--curva) infinite}
.meter-rows{display:flex;flex-direction:column;gap:6px;margin-top:var(--e3)}
.meter-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--e2);font-size:var(--t-xs);color:var(--on-dark-soft)}
.meter-val{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--on-dark);font-variant-numeric:tabular-nums}
.meter-bar{height:4px;border-radius:2px;background:rgba(242,244,246,.14);overflow:hidden;margin-top:var(--e3)}
.meter-bar span{display:block;height:100%;background:var(--sun);transition:width .9s var(--curva)}
.meter-note{font-size:var(--t-xs);color:var(--on-dark-faint);margin-top:var(--e2);line-height:var(--lh-snug)}

/* ---------- area principal ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--e5);flex-wrap:wrap;
  padding:var(--e6) var(--e7) var(--e4);border-bottom:1px solid var(--line);
  background:var(--ground);
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-weight:700;font-size:clamp(24px,2.2vw,27px);letter-spacing:-.025em}
.topbar-sub{font-size:var(--t-sm);color:var(--faint);margin-top:5px}
.topbar-actions{display:flex;align-items:center;gap:var(--e2);flex-wrap:wrap}

.seg{display:flex;background:var(--ground-2);border-radius:var(--r-md);padding:3px}
.seg button{
  padding:6px 14px;border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:600;color:var(--muted);
  transition:background .16s var(--curva),color .16s var(--curva);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.seg .short{display:none}

.ghost-btn{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 var(--e3);border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface);font-size:var(--t-sm);font-weight:600;color:var(--ink-2);
  transition:border-color .14s var(--curva),color .14s var(--curva);
}
.ghost-btn:hover{border-color:var(--n-500);color:var(--ink)}
.dark-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--e2);
  height:36px;padding:0 var(--e4);border-radius:var(--r-md);
  background:var(--dark);color:var(--on-dark);font-size:var(--t-sm);font-weight:600;
  transition:background .14s var(--curva);
}
.dark-btn:hover:not([disabled]){background:var(--dark-2)}
.dark-btn[disabled]{background:var(--n-300);color:var(--n-500);cursor:not-allowed}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-sm);font-weight:600;color:var(--sun-ink);transition:color .14s var(--curva)}
.link-btn:hover{color:var(--sun-deeper);text-decoration:underline;text-underline-offset:3px}

.page{padding:var(--e6) var(--e7) var(--e8)}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--e4);align-items:start}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:var(--e4)}

/* Cartao: a borda define a peca, sem sombra junto. Quem flutua de
   verdade - aviso e dica - e que ganha sombra, e ai sem borda. */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--e5) var(--e6);
  transition:border-color .18s var(--curva);
}
.card--tight{padding:var(--e4) var(--e5)}
.card--dark{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.card--dark h2,.card--dark h3{color:var(--on-dark)}

.card h2{font-weight:700;font-size:var(--t-md);letter-spacing:-.015em}
.card h3{font-weight:700;font-size:var(--t-base);letter-spacing:-.01em}
.card-sub{font-size:var(--t-sm);color:var(--faint);margin-top:var(--e1);line-height:var(--lh-snug);max-width:62ch}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e5);flex-wrap:wrap}
.card--dark .card-sub{color:var(--on-dark-soft)}

.legend{display:flex;gap:var(--e4);align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--muted)}
.card--dark .legend span{color:var(--on-dark-soft)}
.swatch{width:12px;height:3px;border-radius:2px;flex-shrink:0}
.swatch--sq{width:9px;height:9px;border-radius:2px}
.rule{height:1px;background:var(--line);border:0;margin:var(--e5) 0 var(--e4)}

.pill{font-size:var(--t-xs);font-weight:600;padding:3px var(--e2);border-radius:var(--r-pill);white-space:nowrap}
.pill--warn{background:var(--warn-bg);color:var(--warn)}
.pill--good{background:var(--good-bg);color:var(--good)}
.pill--bad{background:var(--bad-bg);color:var(--bad)}
.pill--neutral{background:var(--ground-2);color:var(--muted)}
.pill--ia{display:inline-flex;align-items:center;gap:4px;background:var(--sun-wash);color:var(--sun-ink);
  font-size:var(--t-xs);padding:3px 7px;border-radius:var(--r-pill);font-weight:600}

/* Numero grande. Tabular sempre: numero que troca a cada 2 segundos nao
   pode dancar de largura enquanto voce olha. */
.big{font-family:var(--f-display);font-weight:700;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.card--dark .big{color:var(--on-dark)}
.big-30{font-size:var(--t-xl);letter-spacing:-.03em}
.big-32{font-size:var(--t-xl);letter-spacing:-.03em}
.big-34{font-size:var(--t-2xl);letter-spacing:-.033em}
.big-40{font-size:var(--t-2xl);letter-spacing:-.033em}
.big-46{font-size:var(--t-3xl);letter-spacing:-.035em}
.big-74{font-size:var(--t-4xl);letter-spacing:-.038em;line-height:.92}


/* ===== css/telas.css ===== */
/* telas.css
   Estilos de cada tela: painel, historico, aparelhos, alertas, relatorio.
   Parte do sistema de design do Solaris. A ordem em que os arquivos
   de CSS entram no index.html importa: base, componentes, telas,
   responsivo e impressao, nessa sequencia. */

/* ---------- painel: o bloco da economia ----------
   E o unico bloco escuro do conteudo, e por isso ele nao precisa de
   brilho nem de halo para chamar atencao: ja e a coisa mais escura da
   tela. O ambar aparece so na barra do dia, que e geracao de verdade. */
.hero{padding:var(--e6)}
.hero-in{position:relative}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e4);flex-wrap:wrap}
.hero-kicker{font-size:var(--t-sm);color:var(--on-dark-soft);font-weight:500}
.delta{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px var(--e2);
  font-size:var(--t-xs);font-weight:600;background:rgba(95,202,154,.14);color:var(--good-on-dark);
}
.delta--down{background:rgba(174,63,39,.20);color:#E9A99B}
.delta--down svg{transform:rotate(180deg)}
.hero-money{display:flex;align-items:baseline;gap:var(--e2);margin-top:var(--e3)}
.hero-cur{font-family:var(--f-display);font-weight:400;font-size:var(--t-xl);color:var(--on-dark-soft)}
.hero-line{font-size:var(--t-sm);color:var(--on-dark-soft);margin-top:var(--e4);max-width:56ch;line-height:var(--lh-body)}

/* Sete colunas: os ultimos sete dias. A de hoje e a unica ambar. */
.spark{display:flex;align-items:flex-end;gap:5px;height:78px;margin-top:var(--e6)}
.spark-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
/* A escala comeca no zero, entao meses parecidos produzem barras
   parecidas mesmo. Isso e honesto: quem resolve isso esticando a base
   inventa uma diferenca que nao existe. O que da para melhorar e o
   contraste, para a variacao real ficar legivel. */
.spark-bar{
  width:100%;border-radius:3px 3px 0 0;background:rgba(242,244,246,.30);
  transition:background .16s var(--curva),height .5s var(--curva);
}
.spark-col:hover .spark-bar{background:rgba(242,244,246,.46)}
.spark-col.is-now .spark-bar{background:var(--sun)}
.spark-lbl{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--on-dark-faint)}
.spark-col.is-now .spark-lbl{color:var(--sun-lite);font-weight:600}

/* ---------- donut: quanto do consumo o sol cobriu ---------- */
.donut-wrap{display:flex;align-items:center;gap:var(--e6);margin-top:var(--e4);flex-wrap:wrap}
.donut{position:relative;width:128px;height:128px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut-ring{transition:stroke-dasharray 1s var(--curva)}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-pct{font-family:var(--f-display);font-weight:700;font-size:var(--t-2xl);letter-spacing:-.035em;line-height:1;color:var(--ink)}
.donut-cap{font-size:var(--t-xs);color:var(--faint);margin-top:2px}
.split{display:flex;flex-direction:column;gap:var(--e3);min-width:0}
.split-row-top{display:flex;align-items:center;gap:7px}
.split-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.split-lbl{font-size:var(--t-sm);color:var(--muted)}
.split-val{font-family:var(--f-mono);font-size:var(--t-md);font-weight:500;margin-top:2px;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- kpi ---------- */
.kpi-top{display:flex;align-items:center;gap:7px}
.kpi-lbl{font-size:var(--t-sm);color:var(--muted);font-weight:500}
.kpi-val{display:flex;align-items:baseline;gap:5px;margin-top:var(--e3)}
.kpi-unit{font-size:var(--t-sm);color:var(--faint);font-weight:500}
.kpi-note{font-size:var(--t-xs);color:var(--faint);margin-top:var(--e2);line-height:var(--lh-snug);max-width:46ch}

/* ---------- graficos ---------- */
.chart{position:relative;margin-top:var(--e4)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart-axis{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--f-mono);font-size:var(--t-xs);color:var(--faint)}
.now-line{stroke:var(--n-500);stroke-width:1;stroke-dasharray:3 3}
.now-dot{transform-box:fill-box;transform-origin:center}

/* Dica flutuante: sombra sem borda, porque de fato paira sobre o grafico. */
.tip{
  position:absolute;z-index:40;pointer-events:none;opacity:0;transform:translate(-50%,-116%);
  background:var(--dark);color:var(--on-dark);border-radius:var(--r-sm);padding:var(--e2) var(--e3);
  font-size:var(--t-xs);line-height:var(--lh-snug);white-space:nowrap;box-shadow:var(--elev-alto);
  transition:opacity .12s var(--curva);
}
.tip.on{opacity:1}
.tip b{font-family:var(--f-mono);font-weight:500;color:var(--sun-lite)}
.tip i{font-style:normal;font-family:var(--f-mono);color:#9FB3D6}

/* barras do historico: consumo (rede) ao lado de geracao (sol) */
.hbars{display:flex;align-items:flex-end;gap:4px;margin-top:var(--e6)}
.hbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:default}
.hbar-pair{display:flex;align-items:flex-end;gap:2px;height:148px;width:100%}
.hbar-pair i{display:block;width:100%;border-radius:2px 2px 0 0;transition:height .45s var(--curva),opacity .14s var(--curva)}
.hbar-c{background:var(--grid)}
.hbar-g{background:var(--sun)}
.hbar:hover .hbar-pair i{opacity:.75}
.hbar-saldo{width:100%;height:3px;border-radius:2px}
.hbar-lbl{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--faint);height:14px;white-space:nowrap}

.compare-lbl{display:flex;justify-content:space-between;font-size:var(--t-sm);color:var(--muted);margin-bottom:7px}
.track{height:10px;background:var(--ground-2);border-radius:var(--r-pill);overflow:hidden}
.track i{display:block;height:100%;border-radius:var(--r-pill);transition:width .6s var(--curva)}

.note{display:flex;gap:var(--e3);padding:var(--e3) var(--e4);border-radius:var(--r-md)}
.note-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.note-t{font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.note-s{font-size:var(--t-sm);margin-top:2px;line-height:var(--lh-snug);max-width:64ch}
.note--good{background:var(--good-bg)}
.note--good .note-dot{background:var(--good)}
.note--good .note-s{color:#3D5F51}
.note--bad{background:var(--bad-bg)}
.note--bad .note-dot{background:var(--bad)}
.note--bad .note-s{color:#7C3E2B}
.note--sun{background:var(--ground-2)}
.note--sun .note-dot{background:var(--sun)}
.note--sun .note-s{color:var(--muted)}

/* ---------- para onde vai a energia ---------- */
.mixbar{display:flex;height:12px;border-radius:var(--r-xs);overflow:hidden;margin-top:var(--e5);gap:2px}
.mixbar i{display:block;transition:width .5s var(--curva)}
.toplist{display:flex;flex-direction:column;gap:1px;margin-top:var(--e4)}
.toprow{display:flex;align-items:center;gap:var(--e3);width:100%;padding:var(--e2) var(--e2);border-radius:var(--r-sm);transition:background .13s var(--curva)}
.toprow:hover{background:var(--ground-2)}
.toprow-bar{width:4px;height:32px;border-radius:2px;flex-shrink:0}
.toprow-name{font-size:var(--t-sm);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow-sub{font-size:var(--t-xs);color:var(--faint)}
.toprow-num{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.toprow-cash{font-size:var(--t-xs);color:var(--faint)}

/* ---------- tabela de aparelhos ---------- */
.eq-head,.eq-row{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 84px 58px 32px;gap:var(--e3);align-items:center}
.eq-head{padding:0 var(--e3) var(--e2);font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.eq-list{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.eq-row{
  width:100%;padding:var(--e3);border-radius:var(--r-sm);border:1px solid transparent;
  transition:background .13s var(--curva),border-color .13s var(--curva);
}
.eq-row:hover{background:var(--ground-2)}
.eq-row[aria-expanded="true"]{background:var(--surface);border-color:var(--n-500)}
.eq-pos{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--faint)}
.eq-name{display:flex;align-items:center;gap:7px;min-width:0}
.eq-name b{font-size:var(--t-sm);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-meta{font-size:var(--t-xs);color:var(--faint);margin-top:2px}
/* display:block e obrigatorio: no HTML isto e um <span>, e um span inline
   ignora altura - a barra de participacao ficava com 0px e nunca aparecia. */
.eq-track{display:block;height:6px;background:var(--ground-2);border-radius:var(--r-pill);overflow:hidden}
.eq-track i{display:block;height:100%;border-radius:var(--r-pill);transition:width .5s var(--curva)}
.eq-pct{font-size:var(--t-xs);color:var(--faint);margin-top:4px}
.eq-kwh{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.eq-cash{font-size:var(--t-xs);color:var(--faint)}
.eq-trend{font-family:var(--f-mono);font-size:var(--t-xs);font-weight:500}
.eq-kill{opacity:0;color:var(--faint);padding:4px;border-radius:var(--r-xs);transition:opacity .13s var(--curva),color .13s var(--curva),background .13s var(--curva)}
.eq-row:hover .eq-kill,.eq-kill:focus-visible{opacity:1}
.eq-kill:hover{color:var(--bad);background:var(--bad-bg)}

.detect{display:flex;align-items:center;gap:var(--e4);background:var(--dark);color:var(--on-dark);border-radius:var(--r-lg);padding:var(--e4) var(--e5);flex-wrap:wrap}
.detect-ic{width:34px;height:34px;border-radius:var(--r-sm);background:rgba(217,119,6,.20);color:var(--sun-lite);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detect-t{font-size:var(--t-base);font-weight:600}
.detect-s{font-size:var(--t-sm);color:var(--on-dark-soft);margin-top:2px}
.detect-btns{display:flex;gap:var(--e2);flex-shrink:0}
.btn-no{padding:7px var(--e4);border-radius:var(--r-md);font-size:var(--t-sm);font-weight:600;border:1px solid rgba(242,244,246,.26);color:var(--on-dark-soft);transition:color .14s var(--curva),border-color .14s var(--curva)}
.btn-no:hover{color:var(--on-dark);border-color:var(--on-dark)}
.btn-yes{padding:7px var(--e4);border-radius:var(--r-md);font-size:var(--t-sm);font-weight:600;background:var(--sun);color:var(--n-900);transition:background .14s var(--curva)}
.btn-yes:hover{background:var(--sun-lite)}

.empty{background:var(--ground-2);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:var(--e7) var(--e6);text-align:center}
.empty-t{font-size:var(--t-base);font-weight:600;color:var(--ink-2);margin-top:var(--e3)}
.empty-s{font-size:var(--t-sm);color:var(--faint);margin-top:6px;line-height:var(--lh-body);max-width:52ch;margin-left:auto;margin-right:auto}

.det-head{display:flex;align-items:flex-start;gap:var(--e3)}
.det-chip{width:40px;height:40px;border-radius:var(--r-sm);flex-shrink:0}
.det-name{font-family:var(--f-display);font-weight:700;font-size:var(--t-md);letter-spacing:-.015em;line-height:var(--lh-snug);color:var(--ink)}
.det-loc{font-size:var(--t-sm);color:var(--faint);margin-top:2px}
.det-x{color:var(--faint);padding:2px;transition:color .14s var(--curva)}
.det-x:hover{color:var(--ink)}
/* Sem cartao dentro de cartao: os dados do aparelho sao so um bloco de
   fundo levemente diferente, sem borda e sem sombra propria. */
.det-facts{display:grid;grid-template-columns:1fr 1fr;gap:var(--e2);margin-top:var(--e5)}
.fact{background:var(--ground-2);border-radius:var(--r-sm);padding:var(--e2) var(--e3)}
.fact-k{font-size:var(--t-xs);color:var(--faint)}
.fact-v{font-family:var(--f-mono);font-size:var(--t-base);font-weight:500;color:var(--ink);margin-top:2px}
.prof{display:flex;align-items:flex-end;gap:2px;height:52px}
.prof i{display:block;flex:1;border-radius:1px;transition:height .4s var(--curva)}
.tips{display:flex;flex-direction:column;gap:var(--e3)}
.tip-row{display:flex;gap:var(--e2)}
.tip-row svg{flex-shrink:0;margin-top:3px}
.tip-txt{font-size:var(--t-sm);line-height:var(--lh-body);max-width:64ch}
.tip-txt b{font-weight:600;color:var(--ink)}
.tip-txt span{color:var(--muted)}

/* ---------- formulario ---------- */
.field{margin-top:var(--e5)}
.field:first-of-type{margin-top:var(--e5)}
.field-lbl{font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.text-in{
  width:100%;height:42px;margin-top:6px;padding:0 var(--e3);border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface);
  font-family:var(--f-body);font-size:var(--t-base);color:var(--ink);outline:none;
  transition:border-color .14s var(--curva),box-shadow .14s var(--curva);
}
.text-in:focus{border-color:var(--sun-ink);box-shadow:var(--anel-foco)}
.text-in::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--e2)}
.chip{
  padding:6px var(--e3);border-radius:var(--r-sm);font-size:var(--t-sm);font-weight:500;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  transition:border-color .13s var(--curva),background .13s var(--curva),color .13s var(--curva);
}
.chip:hover{border-color:var(--n-500)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-dark)}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e3)}
.slider-val{font-family:var(--f-mono);font-size:var(--t-base);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:var(--e2) 0 0;accent-color:var(--sun);cursor:pointer;height:22px}
.slider-ends{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--faint);margin-top:2px}
.sliders{display:flex;flex-direction:column;gap:var(--e5)}
.est-bar{height:8px;background:rgba(242,244,246,.14);border-radius:var(--r-pill);overflow:hidden;margin-top:var(--e5)}
.est-bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--sun);transition:width .4s var(--curva)}
.saved{display:flex;align-items:center;gap:7px;margin-top:var(--e3);font-size:var(--t-sm);color:var(--good-on-dark)}
.preset{display:flex;align-items:center;justify-content:space-between;gap:var(--e3);width:100%;padding:var(--e2) var(--e2);border-radius:var(--r-sm);transition:background .13s var(--curva)}
.preset:hover{background:var(--ground-2)}
.preset-n{font-size:var(--t-sm);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset-d{font-size:var(--t-xs);color:var(--faint);margin-top:2px}

/* ---------- alertas ---------- */
.goal-track{position:relative;height:12px;background:var(--ground-2);border-radius:var(--r-pill);margin-top:var(--e6)}
.goal-fill{height:100%;border-radius:var(--r-pill);transition:width .5s var(--curva),background .3s var(--curva)}
.goal-mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.goal-mark::after{content:attr(data-l);position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:var(--t-xs);color:var(--faint);white-space:nowrap;font-family:var(--f-mono)}
.rule-row{display:flex;align-items:center;gap:var(--e3);width:100%;padding:var(--e3) var(--e2);border-radius:var(--r-sm);transition:background .13s var(--curva)}
.rule-row:hover{background:var(--ground-2)}
.rule-t{font-size:var(--t-sm);font-weight:600;color:var(--ink);line-height:var(--lh-snug)}
.rule-s{font-size:var(--t-xs);color:var(--faint);margin-top:2px;max-width:56ch}
.tog{width:40px;height:23px;border-radius:var(--r-pill);flex-shrink:0;padding:3px;display:flex;transition:background .18s var(--curva);background:var(--n-300);justify-content:flex-start}
.tog[aria-pressed="true"]{background:var(--good);justify-content:flex-end}
.tog i{display:block;width:17px;height:17px;border-radius:50%;background:#fff}

/* O alerta ja e um bloco colorido inteiro. Nao leva tambem uma faixa na
   lateral: cor de fundo e ponto ja dizem a gravidade. */
.feed{display:flex;flex-direction:column;gap:var(--e2);margin-top:var(--e4)}
.feed-item{display:flex;gap:var(--e3);padding:var(--e3) var(--e4);border-radius:var(--r-md);border:1px solid}
.feed-item--alto{background:var(--bad-bg);border-color:var(--bad-line)}
.feed-item--alto .feed-dot{background:var(--bad)}
.feed-item--medio{background:var(--warn-bg);border-color:var(--warn-line)}
.feed-item--medio .feed-dot{background:var(--warn)}
.feed-item--bom{background:var(--good-bg);border-color:var(--good-line)}
.feed-item--bom .feed-dot{background:var(--good)}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex-shrink:0}
.feed-t{display:flex;align-items:baseline;gap:var(--e2);flex-wrap:wrap}
.feed-t b{font-size:var(--t-base);font-weight:600;color:var(--ink)}
.feed-t span{font-size:var(--t-xs);color:var(--muted)}
.feed-x{font-size:var(--t-sm);color:var(--ink-2);margin-top:3px;line-height:var(--lh-body);max-width:70ch}
.feed-close{
  flex-shrink:0;align-self:flex-start;padding:5px;border-radius:var(--r-xs);color:var(--muted);
  opacity:.6;transition:opacity .13s var(--curva),background .13s var(--curva),color .13s var(--curva);
}
.feed-item:hover .feed-close,.feed-close:focus-visible{opacity:1}
.feed-close:hover{background:rgba(21,24,28,.08);color:var(--ink)}

/* ---------- relatorio ---------- */
.inv-head,.inv-row{display:grid;grid-template-columns:1fr 150px 130px;gap:var(--e3)}
.inv-head{margin-top:var(--e6);padding-bottom:var(--e2);font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.inv-row{padding:var(--e3) 0;border-top:1px solid var(--line);font-size:var(--t-sm)}
.inv-row--total{padding:var(--e4) 0 var(--e1);border-top:2px solid var(--ink);font-size:var(--t-md);font-weight:700;color:var(--ink)}
.inv-row--credit{color:var(--good)}
.inv-q{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted)}
.inv-v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.leaf{display:flex;gap:var(--e3);background:var(--good-bg);border-radius:var(--r-md);padding:var(--e4) var(--e5);margin-top:var(--e6)}
.leaf-t{font-size:var(--t-base);font-weight:600;color:#1C5940}
.leaf-s{font-size:var(--t-sm);color:#3D5F51;margin-top:3px;line-height:var(--lh-body);max-width:66ch}
.ybars{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:var(--e5)}
.ybar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ybar i{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--n-300);transition:height .5s var(--curva)}
.ybar.is-now i{background:var(--sun)}
.ybar span{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--faint)}

/* ---------- config ---------- */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e5);font-size:var(--t-sm)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;color:var(--ink)}
.kv dd.mono{font-weight:500}
.kvs{display:flex;flex-direction:column;gap:var(--e3);margin:0}
.softbox{background:var(--ground-2);border-radius:var(--r-md);padding:var(--e3) var(--e4);margin-top:var(--e5);font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);max-width:70ch}
.softbox b{color:var(--ink);font-weight:600}
.unit--nova{color:var(--on-dark-faint);border:1px dashed rgba(242,244,246,.22);margin-top:var(--e1);justify-content:center;gap:6px}
.unit--nova:hover{color:var(--on-dark);border-color:rgba(242,244,246,.45)}
.unit--nova .unit-name{font-weight:600;font-size:var(--t-xs)}

.un-list{display:flex;flex-direction:column;gap:1px;margin-top:var(--e4)}
.un-row{display:flex;align-items:center;gap:var(--e3);padding:var(--e3);border-radius:var(--r-sm);transition:background .13s var(--curva)}
.un-row:hover{background:var(--ground-2)}
.un-row>span:first-child{flex:1;min-width:0}
.un-meta{display:block;font-size:var(--t-xs);color:var(--faint);margin-top:2px}

.dica{font-size:var(--t-xs);color:var(--faint);margin-top:5px;line-height:var(--lh-snug);max-width:56ch}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:var(--e2)}
.opt{
  display:block;width:100%;padding:var(--e3) var(--e4);border-radius:var(--r-md);text-align:left;
  border:1px solid var(--line-2);background:var(--surface);
  transition:border-color .13s var(--curva),background .13s var(--curva);
}
.opt:hover{border-color:var(--n-500)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ground-2)}
.opt-t{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.opt-d{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:3px;line-height:var(--lh-snug);max-width:62ch}

.danger-btn{font-size:var(--t-sm);font-weight:600;color:var(--bad);transition:color .14s var(--curva)}
.danger-btn:hover{color:#8A3320;text-decoration:underline;text-underline-offset:3px}

/* ---------- avisos flutuantes ----------
   Estes de fato pairam sobre a pagina, entao levam sombra e nao borda. */
.toasts{position:fixed;right:var(--e5);bottom:var(--e5);z-index:200;display:flex;flex-direction:column;gap:var(--e2);max-width:min(360px,calc(100vw - 40px))}
/* Em tela estreita a barra de abas mora no rodape. Sem esta folga o aviso
   cai em cima dela e tapa a navegacao inteira. */
@media (max-width:760px){
  .toasts{
    left:var(--e4);right:var(--e4);max-width:none;
    bottom:calc(72px + env(safe-area-inset-bottom));
  }
}
.toast{
  display:flex;gap:var(--e3);color:var(--on-dark);border-radius:var(--r-md);padding:var(--e3) var(--e4);
  background:var(--dark);box-shadow:var(--elev-alto);
  animation:slidein .3s var(--curva);
}
.toast.out{animation:slideout .24s var(--curva) forwards}
.toast-dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--sun)}
.toast--good .toast-dot{background:var(--good-on-dark)}
.toast--bad .toast-dot{background:#E9A99B}
.toast-t{font-size:var(--t-sm);font-weight:600}
.toast-s{font-size:var(--t-xs);color:var(--on-dark-soft);margin-top:2px;line-height:var(--lh-snug)}

/* ---------- animacoes ----------
   So transform e opacity. Animar largura ou altura obriga o navegador a
   recalcular o layout a cada quadro, e ai trava. */
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(20px)}}
/* Comeca em .4 e nao em 0: assim o conteudo nunca fica invisivel, nem
   por um instante. Numa maquina lenta, animacao que parte do zero deixa
   a tela em branco bem na hora em que a pessoa esta olhando. */
@keyframes fadeup{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
/* A entrada e enfeite: o conteudo ja esta visivel, isto so suaviza a
   troca de tela. Por isso backwards e nao forwards - nada fica invisivel
   se a animacao nao rodar. */
.enter>*{animation:fadeup .28s var(--curva) backwards}
.enter>*:nth-child(1){animation-delay:.01s}
.enter>*:nth-child(2){animation-delay:.03s}
.enter>*:nth-child(3){animation-delay:.05s}
.enter>*:nth-child(4){animation-delay:.07s}
.enter>*:nth-child(5){animation-delay:.09s}
.enter>*:nth-child(n+6){animation-delay:.11s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}


/* ===== css/conta.css ===== */
/* conta.css
   Tela de entrada, cartao da conta e o painel do banco de dados.
   Parte do sistema de design do Solaris. A ordem em que os arquivos
   de CSS entram no index.html importa: base, componentes, telas,
   responsivo e impressao, nessa sequencia. */

body.vista-login{background:var(--dark)}

/* ============================================================
   TELA DE ENTRADA
   E a primeira coisa que a pessoa ve, entao ela carrega o peso de
   explicar o que o site faz. Duas colunas no desktop: a esquerda
   diz o que e, a direita deixa entrar. No celular vira uma coluna,
   com a vitrine encolhida em cima.
   ============================================================ */
.entrada{
  min-height:100vh;min-height:100dvh;
  display:grid;grid-template-columns:1.05fr .95fr;
  background:var(--dark);color:var(--on-dark);
}

/* ---------- coluna da esquerda: o que o site faz ---------- */
.ent-vitrine{
  position:relative;display:flex;align-items:center;
  padding:var(--e8) 6vw;
  background:var(--dark);
}
.ent-vitrine-in{position:relative;max-width:470px}

.ent-marca{display:flex;align-items:center;gap:var(--e3)}
.ent-ic{
  width:42px;height:42px;border-radius:var(--r-md);flex-shrink:0;display:grid;place-items:center;
  background:var(--sun);color:var(--n-900);
}
.ent-nome{font-family:var(--f-display);font-weight:800;font-size:var(--t-lg);letter-spacing:-.025em;line-height:1}
.ent-tag{font-size:var(--t-xs);color:var(--on-dark-faint);margin-top:3px;line-height:1.2}

/* Manchete curta, por isso pode ser grande. Frase longa em corpo de
   display come a tela inteira e nao sobra nada acima da dobra. */
.ent-titulo{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(32px,3.6vw,46px);letter-spacing:-.035em;line-height:1.06;
  margin:var(--e7) 0 0;
  /* A vitrine e escura: sem isto o titulo herda a tinta preta do h1 e
     some no fundo. */
  color:var(--on-dark);
}
.ent-linha{font-size:var(--t-md);color:var(--on-dark-soft);line-height:var(--lh-body);margin:var(--e4) 0 0;max-width:46ch}

.ent-lista{list-style:none;margin:var(--e7) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--e5)}
.ent-lista li{display:flex;gap:var(--e3);align-items:flex-start}
.ent-li-ic{
  width:30px;height:30px;border-radius:var(--r-sm);flex-shrink:0;display:grid;place-items:center;
  background:rgba(217,119,6,.22);color:var(--sun-lite);
}
.ent-lista b{display:block;font-size:var(--t-base);font-weight:600;color:var(--on-dark)}
.ent-lista span{display:block;font-size:var(--t-sm);color:var(--on-dark-soft);margin-top:3px;line-height:var(--lh-body);max-width:44ch}

.ent-rodape{
  display:flex;align-items:center;gap:var(--e2);margin-top:var(--e7);
  font-size:var(--t-sm);color:var(--on-dark-faint);
}

/* ---------- coluna da direita: entrar ---------- */
.ent-form{
  display:flex;align-items:center;justify-content:center;
  padding:var(--e8) 5vw;background:var(--ground);color:var(--ink-2);
}
.ent-cx{width:100%;max-width:376px}

.ent-abas{display:flex;background:var(--ground-2);border-radius:var(--r-md);padding:3px;gap:2px}
.ent-abas button{
  flex:1;padding:9px 0;border-radius:var(--r-sm);text-align:center;
  font-size:var(--t-sm);font-weight:600;color:var(--muted);
  transition:background .16s var(--curva),color .16s var(--curva);
}
.ent-abas button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.ent-abas button:not([aria-selected="true"]):hover{color:var(--ink)}

.ent-sub{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin:var(--e4) 0 0;max-width:44ch}

.ent-campos{display:flex;flex-direction:column;gap:var(--e3);margin-top:var(--e5)}
.ent-campo{display:flex;flex-direction:column;gap:6px}
.ent-campo>span{font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.ent-campo input{
  height:44px;padding:0 var(--e3);border-radius:var(--r-md);width:100%;
  border:1px solid var(--line-2);background:var(--surface);
  font-family:var(--f-body);font-size:var(--t-base);color:var(--ink);outline:none;
  transition:border-color .14s var(--curva),box-shadow .14s var(--curva);
}
.ent-campo input:focus{border-color:var(--sun-ink);box-shadow:var(--anel-foco)}
.ent-campo input::placeholder{color:var(--faint)}

.ent-check{display:flex;align-items:center;gap:var(--e2);font-size:var(--t-sm);color:var(--muted);cursor:pointer}
.ent-check input{accent-color:var(--sun);width:16px;height:16px;cursor:pointer;flex-shrink:0}

.ent-erro{
  display:flex;gap:var(--e2);align-items:flex-start;
  background:var(--bad-bg);border:1px solid var(--bad-line);color:#7C3E2B;
  border-radius:var(--r-md);padding:var(--e3);font-size:var(--t-sm);line-height:var(--lh-snug);
}
.ent-erro svg{flex-shrink:0;margin-top:2px}

.ent-botao{
  height:46px;border-radius:var(--r-md);background:var(--dark);color:var(--on-dark);
  font-size:var(--t-base);font-weight:600;margin-top:var(--e1);
  display:flex;align-items:center;justify-content:center;gap:var(--e2);
  transition:background .14s var(--curva);
}
.ent-botao:hover:not([disabled]){background:var(--dark-2)}
.ent-botao[disabled]{opacity:.6;cursor:progress}
.ent-girando{
  width:15px;height:15px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(242,244,246,.3);border-top-color:var(--on-dark);
  animation:girar .7s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}

.ent-ou{display:flex;align-items:center;gap:var(--e3);margin:var(--e6) 0 var(--e4);color:var(--faint);font-size:var(--t-xs)}
.ent-ou::before,.ent-ou::after{content:"";flex:1;height:1px;background:var(--line)}

/* O caminho de teste. Fica visivel de proposito: durante o teste de campo
   ninguem deveria travar numa tela de cadastro. */
.ent-visitante{
  width:100%;height:44px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;gap:var(--e2);
  border:1px solid var(--sun-ink);background:var(--sun-wash);
  font-size:var(--t-base);font-weight:600;color:var(--sun-deeper);
  transition:background .14s var(--curva);
}
.ent-visitante:hover{background:#FAE9CF}
.ent-visitante-d{font-size:var(--t-xs);color:var(--faint);margin:var(--e2) auto 0;line-height:var(--lh-snug);text-align:center;max-width:40ch}

.ent-aviso{margin-top:var(--e6);border-top:1px solid var(--line);padding-top:var(--e4)}
.ent-aviso summary{
  font-size:var(--t-sm);font-weight:600;color:var(--muted);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:7px;
}
.ent-aviso summary::-webkit-details-marker{display:none}
.ent-aviso summary::before{content:"\203A";font-size:var(--t-md);transition:transform .18s var(--curva)}
.ent-aviso[open] summary::before{transform:rotate(90deg)}
.ent-aviso summary:hover{color:var(--ink)}
.ent-aviso p{font-size:var(--t-xs);color:var(--muted);line-height:var(--lh-body);margin:var(--e3) 0 0;max-width:52ch}
.ent-aviso b{color:var(--ink)}

.ent-contador{font-size:var(--t-xs);color:var(--faint);text-align:center;margin-top:var(--e4)}

/* ---------- uma coluna quando nao cabe duas ---------- */
@media (max-width:900px){
  .entrada{grid-template-columns:1fr}
  .ent-vitrine{padding:var(--e7) var(--e6) var(--e6);align-items:flex-start}
  .ent-vitrine-in{max-width:none}
  .ent-titulo{font-size:30px;margin-top:var(--e5);max-width:20ch}
  .ent-linha{font-size:var(--t-base)}
  /* no celular a lista de argumentos rouba a tela toda; fica so o essencial */
  .ent-lista{display:none}
  .ent-rodape{margin-top:var(--e5)}
  .ent-form{padding:var(--e7) var(--e6) var(--e8)}
  .ent-cx{max-width:420px;margin:0 auto}
}
@media (max-width:420px){
  .ent-titulo{font-size:26px}
  .ent-vitrine{padding:var(--e6) var(--e5)}
  .ent-form{padding:var(--e6) var(--e5) var(--e7)}
}

/* cartao da conta no menu lateral */
.conta{display:flex;align-items:center;gap:var(--e2);padding:var(--e2) var(--e2);border-radius:var(--r-md);
  border:1px solid rgba(242,244,246,.13)}
.conta-av{
  width:30px;height:30px;border-radius:var(--r-sm);flex-shrink:0;display:grid;place-items:center;
  background:var(--sun);color:var(--n-900);
  font-family:var(--f-display);font-weight:700;font-size:var(--t-base);
}
.conta-av--vis{background:rgba(242,244,246,.16);color:var(--on-dark-soft)}
.conta-txt{flex:1;min-width:0}
.conta-nome{display:block;font-size:var(--t-sm);font-weight:600;color:var(--on-dark);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta-mail{display:block;font-size:var(--t-xs);color:var(--on-dark-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conta-sair{color:var(--on-dark-faint);padding:5px;border-radius:var(--r-xs);flex-shrink:0;transition:color .14s var(--curva),background .14s var(--curva)}
.conta-sair:hover{color:var(--on-dark);background:rgba(242,244,246,.1)}
.conta--entrar{width:100%;text-align:left;transition:background .14s var(--curva),border-color .14s var(--curva)}
.conta--entrar:hover{background:rgba(242,244,246,.09);border-color:rgba(242,244,246,.26)}
.conta--entrar .conta-nome{color:var(--sun-lite)}

.auth-voltar{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--t-sm);font-weight:600;
  color:var(--sun-ink);margin-bottom:var(--e4);transition:color .14s var(--curva);
}
.auth-voltar:hover{color:var(--sun-deeper)}

@media (max-width:1040px){
  .conta{justify-content:center;padding:var(--e2)}
  .conta-txt{display:none}
  .conta-sair{display:none}
}
@media (max-width:760px){
  .auth-cx{max-width:none;border-radius:var(--r-lg);padding:var(--e6) var(--e5)}
}

/* ============================================================
   BANCO DE DADOS
   ============================================================ */
.bd-grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--e2);margin-top:var(--e5)}
@media(max-width:900px){.bd-grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bd-cel{background:var(--ground-2);border-radius:var(--r-md);padding:var(--e3) var(--e4)}
.bd-k{font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.bd-v{font-family:var(--f-display);font-weight:700;font-size:var(--t-xl);letter-spacing:-.03em;margin-top:6px;
  line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.bd-s{font-size:var(--t-xs);color:var(--faint);margin-top:4px;line-height:var(--lh-snug)}

.bd-graf{margin-top:var(--e5)}
.bd-graf-t{font-size:var(--t-sm);color:var(--muted)}
.bd-pe{display:flex;align-items:center;justify-content:space-between;gap:var(--e3);flex-wrap:wrap;margin-top:var(--e2);
  font-size:var(--t-xs);color:var(--faint)}
.bd-pe code{font-family:var(--f-mono);font-size:var(--t-xs);background:var(--ground-2);
  padding:2px 6px;border-radius:var(--r-xs)}
.bd-vazio{background:var(--ground-2);border:1px dashed var(--line-2);border-radius:var(--r-md);
  padding:var(--e5);font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-body);margin-top:6px;max-width:66ch}

@media print{ .card{box-shadow:none} }

/* ============================================================
   PRIMEIRA UNIDADE
   Conta nova comeca vazia de proposito. Esta tela pede a primeira
   unidade em vez de mostrar um painel com zeros.
   ============================================================ */
.comecar{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:var(--e8) var(--e6);background:var(--ground);
}
.comecar-cx{width:100%;max-width:520px;text-align:center}

.comecar-ic{
  width:52px;height:52px;border-radius:var(--r-lg);margin:0 auto;
  display:grid;place-items:center;
  background:var(--sun);color:var(--n-900);
}
.comecar-cx h1{
  font-family:var(--f-display);font-weight:800;
  font-size:clamp(27px,3.4vw,34px);letter-spacing:-.03em;line-height:1.1;
  margin:var(--e6) 0 0;
}
.comecar-d{
  font-size:var(--t-md);color:var(--muted);line-height:var(--lh-body);
  margin:var(--e4) auto 0;max-width:46ch;
}
.comecar-d b{color:var(--ink);font-weight:600}

.comecar-precisa{
  text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--e5);margin-top:var(--e6);
}
.comecar-precisa-t{font-size:var(--t-sm);font-weight:700;color:var(--ink)}
.comecar-precisa ul{margin:var(--e3) 0 0;padding-left:var(--e5);display:flex;flex-direction:column;gap:7px}
.comecar-precisa li{font-size:var(--t-sm);color:var(--ink-2);line-height:var(--lh-body)}
.comecar-precisa li b{font-weight:600;color:var(--ink)}
.comecar-precisa-p{font-size:var(--t-xs);color:var(--faint);margin-top:var(--e3);line-height:var(--lh-snug)}

.comecar-botao{width:100%;height:48px;margin-top:var(--e6);border-radius:var(--r-md);font-size:var(--t-base)}
.comecar-ou{
  display:flex;align-items:center;gap:var(--e3);margin:var(--e6) 0 var(--e3);
  color:var(--faint);font-size:var(--t-xs);
}
.comecar-ou::before,.comecar-ou::after{content:"";flex:1;height:1px;background:var(--line)}

.comecar-exemplo{
  width:100%;height:44px;border-radius:var(--r-md);
  border:1px solid var(--line-2);background:var(--surface);
  font-size:var(--t-sm);font-weight:600;color:var(--ink-2);
  transition:border-color .14s var(--curva),color .14s var(--curva);
}
.comecar-exemplo:hover{border-color:var(--n-500);color:var(--ink)}
.comecar-exemplo-d{
  font-size:var(--t-xs);color:var(--faint);margin:var(--e2) auto 0;
  line-height:var(--lh-snug);max-width:44ch;
}

@media (max-width:520px){
  .comecar{padding:var(--e6) var(--e5);align-items:flex-start}
  .comecar-cx h1{font-size:26px}
}

/* o formulario de unidade quando ainda nao existe menu lateral */
.cadastro-solo{min-height:100vh;min-height:100dvh;background:var(--ground);padding:var(--e7) 5vw var(--e8)}
.cadastro-solo-topo{max-width:1100px;margin:0 auto var(--e6)}
.cadastro-solo-topo h1{
  font-family:var(--f-display);font-weight:700;font-size:clamp(25px,2.8vw,32px);
  letter-spacing:-.03em;margin:var(--e3) 0 0;
}
.cadastro-solo-corpo{max-width:1100px;margin:0 auto}
@media (max-width:640px){ .cadastro-solo{padding:var(--e6) var(--e5) var(--e7)} }


/* ===== css/movel.css ===== */
/* movel.css
   Como o site se comporta em tela estreita. E o mesmo site, nao um app.
   Parte do sistema de design do Solaris. A ordem em que os arquivos
   de CSS entram no index.html importa: base, componentes, telas,
   responsivo e impressao, nessa sequencia. */

/* ============================================================
   TELA ESTREITA - a mesma logica, outra casca
   Sem moldura de celular: isto e o proprio site se adaptando, nao a
   simulacao de um aplicativo.
   ============================================================ */
.mob{
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  background:var(--ground);color:var(--ink-2);
}
.mob-head{
  padding:calc(var(--e5) + env(safe-area-inset-top)) var(--e5) var(--e3);
  flex-shrink:0;background:var(--ground);
  position:sticky;top:0;z-index:10;
  border-bottom:1px solid var(--line);

<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<noscript><div class="sem-js"><h1>Solaris</h1><p>O painel lê o medidor em tempo real e desenha os gráficos no próprio navegador, então precisa de JavaScript ativado para funcionar.</p></div></noscript>
<script>
/* ===== js/banco.js ===== */
/* banco.js — o banco de dados

   Usamos IndexedDB, que e o banco que ja vem dentro do navegador. Nao
   precisa instalar nada, nao precisa de servidor, e aguenta muito mais
   dado que o localStorage (que e so um mapa de texto com uns 5 MB).

   Sao tres tabelas:
     contas    quem pode entrar. A chave e o e-mail.
     estado    o que cada conta configurou: unidades, aparelhos, metas, tarifa.
     leituras  o historico do medidor, uma linha por minuto.

   A tabela de leituras e a razao de existir um banco aqui. Uma leitura por
   minuto da 1.440 linhas por dia e mais de dez mil por semana. Isso nao cabe
   em localStorage. Guardamos sete dias e podamos o resto sozinho.

   Se o IndexedDB nao abrir (navegador velho, aba anonima em alguns casos),
   tudo cai automaticamente para localStorage e o site continua funcionando.
   So o historico minuto a minuto deixa de existir, e a tela avisa.

   Tudo aqui e assincrono, entao quase toda funcao devolve Promise.
*/
'use strict';

const BD_NOME = 'solaris';
const BD_VERSAO = 1;
const DIAS_HISTORICO = 7;      /* leituras mais velhas que isso são podadas */
const INTERVALO_LEITURA = 60;  /* segundos entre gravações */

let _bd = null;
let _bdFalhou = false;

function temIndexedDB() {
  try { return typeof indexedDB !== 'undefined' && indexedDB !== null; } catch (e) { return false; }
}

function abrirBanco() {
  if (_bd) return Promise.resolve(_bd);
  if (_bdFalhou || !temIndexedDB()) return Promise.resolve(null);

  return new Promise(resolve => {
    let pedido;
    try { pedido = indexedDB.open(BD_NOME, BD_VERSAO); }
    catch (e) { _bdFalhou = true; return resolve(null); }

    /* se o navegador travar a abertura (modo privado do Firefox, por
       exemplo), não deixamos o app pendurado esperando */
    const desistir = setTimeout(() => { _bdFalhou = true; resolve(null); }, 3000);

    pedido.onupgradeneeded = ev => {
      const bd = ev.target.result;
      if (!bd.objectStoreNames.contains('contas')) {
        bd.createObjectStore('contas', { keyPath: 'id' });
      }
      if (!bd.objectStoreNames.contains('estado')) {
        bd.createObjectStore('estado', { keyPath: 'conta' });
      }
      if (!bd.objectStoreNames.contains('leituras')) {
        const s = bd.createObjectStore('leituras', { keyPath: 'id', autoIncrement: true });
        s.createIndex('porConta', ['conta', 't']);
        s.createIndex('porTempo', 't');
      }
    };
    pedido.onsuccess = () => { clearTimeout(desistir); _bd = pedido.result; resolve(_bd); };
    pedido.onerror = () => { clearTimeout(desistir); _bdFalhou = true; resolve(null); };
    pedido.onblocked = () => { clearTimeout(desistir); _bdFalhou = true; resolve(null); };
  });
}

/* envelopa uma transação numa promise, sempre resolvendo:
   uma falha de banco nunca deve derrubar a tela */
function transacao(tabela, modo, fn) {
  return abrirBanco().then(bd => {
    if (!bd) return null;
    return new Promise(resolve => {
      let resultado = null;
      let t;
      try { t = bd.transaction(tabela, modo); }
      catch (e) { return resolve(null); }
      t.oncomplete = () => resolve(resultado);
      t.onerror = () => resolve(null);
      t.onabort = () => resolve(null);
      try {
        const pedido = fn(t.objectStore(tabela));
        if (pedido) pedido.onsuccess = () => { resultado = pedido.result; };
      } catch (e) { resolve(null); }
    });
  });
}

const bdLer = (tabela, chave) => transacao(tabela, 'readonly', s => s.get(chave));
const bdTodos = tabela => transacao(tabela, 'readonly', s => s.getAll());
const bdGravar = (tabela, valor) => transacao(tabela, 'readwrite', s => s.put(valor));
const bdApagar = (tabela, chave) => transacao(tabela, 'readwrite', s => s.delete(chave));
const bdContar = tabela => transacao(tabela, 'readonly', s => s.count());

/* ---------- reserva em localStorage ----------
   Mesma interface, para o app não precisar saber qual dos dois está
   respondendo. Só entra em ação se o IndexedDB não abrir. */
const PREFIXO_RESERVA = 'solaris.bd.';
function reservaLer(tabela, chave) {
  try { const r = localStorage.getItem(PREFIXO_RESERVA + tabela + '.' + chave); return r ? JSON.parse(r) : undefined; }
  catch (e) { return undefined; }
}
function reservaGravar(tabela, chave, valor) {
  try { localStorage.setItem(PREFIXO_RESERVA + tabela + '.' + chave, JSON.stringify(valor)); } catch (e) { }
}
function reservaApagar(tabela, chave) {
  try { localStorage.removeItem(PREFIXO_RESERVA + tabela + '.' + chave); } catch (e) { }
}
function reservaTodos(tabela) {
  const fora = [], p = PREFIXO_RESERVA + tabela + '.';
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(p) === 0) fora.push(JSON.parse(localStorage.getItem(k)));
    }
  } catch (e) { }
  return fora;
}

/* ---------- API que o resto do app usa ---------- */

const Banco = {
  pronto: false,
  usandoIndexedDB: false,

  async iniciar() {
    const bd = await abrirBanco();
    this.usandoIndexedDB = !!bd;
    this.pronto = true;
    await this.migrarDoLocalStorage();
    await this.podarLeituras();
    return this.usandoIndexedDB;
  },

  /* contas */
  async contas() {
    if (!this.usandoIndexedDB) return reservaTodos('contas');
    return (await bdTodos('contas')) || [];
  },
  async conta(id) {
    if (!this.usandoIndexedDB) return reservaLer('contas', id);
    return await bdLer('contas', id);
  },
  async salvarConta(c) {
    if (!this.usandoIndexedDB) return reservaGravar('contas', c.id, c);
    return await bdGravar('contas', c);
  },
  async apagarConta(id) {
    if (!this.usandoIndexedDB) return reservaApagar('contas', id);
    return await bdApagar('contas', id);
  },

  /* estado do app, um por conta */
  async estado(conta) {
    const r = this.usandoIndexedDB ? await bdLer('estado', conta) : reservaLer('estado', conta);
    return r ? r.dados : null;
  },
  async salvarEstado(conta, dados) {
    const reg = { conta: conta, dados: dados, em: Date.now() };
    if (!this.usandoIndexedDB) return reservaGravar('estado', conta, reg);
    return await bdGravar('estado', reg);
  },
  async apagarEstado(conta) {
    if (!this.usandoIndexedDB) return reservaApagar('estado', conta);
    return await bdApagar('estado', conta);
  },

  /* leituras do medidor — só no IndexedDB, é o que justifica o banco */
  async registrarLeitura(conta, cons, ger) {
    if (!this.usandoIndexedDB) return null;
    return await transacao('leituras', 'readwrite', s => s.add({
      conta: conta, t: Date.now(),
      c: Math.round(cons * 1000) / 1000,
      g: Math.round(ger * 1000) / 1000
    }));
  },

  /* últimas leituras de uma conta, da mais antiga para a mais nova */
  async leituras(conta, desdeMs, limite) {
    if (!this.usandoIndexedDB) return [];
    const bd = await abrirBanco();
    if (!bd) return [];
    const inicio = desdeMs || (Date.now() - 2 * 3600000);
    return new Promise(resolve => {
      const fora = [];
      let t;
      try { t = bd.transaction('leituras', 'readonly'); } catch (e) { return resolve([]); }
      const faixa = IDBKeyRange.bound([conta, inicio], [conta, Date.now() + 1]);
      const cur = t.objectStore('leituras').index('porConta').openCursor(faixa);
      cur.onsuccess = ev => {
        const c = ev.target.result;
        if (!c || (limite && fora.length >= limite)) return resolve(fora);
        fora.push(c.value);
        c.continue();
      };
      cur.onerror = () => resolve(fora);
      t.onerror = () => resolve(fora);
    });
  },

  async contarLeituras() {
    if (!this.usandoIndexedDB) return 0;
    return (await bdContar('leituras')) || 0;
  },

  /* poda o que passou da janela de histórico */
  async podarLeituras() {
    if (!this.usandoIndexedDB) return 0;
    const bd = await abrirBanco();
    if (!bd) return 0;
    const corte = Date.now() - DIAS_HISTORICO * 86400000;
    return new Promise(resolve => {
      let n = 0, t;
      try { t = bd.transaction('leituras', 'readwrite'); } catch (e) { return resolve(0); }
      const cur = t.objectStore('leituras').index('porTempo').openCursor(IDBKeyRange.upperBound(corte));
      cur.onsuccess = ev => {
        const c = ev.target.result;
        if (!c) return;
        c.delete(); n++; c.continue();
      };
      t.oncomplete = () => resolve(n);
      t.onerror = () => resolve(n);
    });
  },

  async limparLeituras(conta) {
    if (!this.usandoIndexedDB) return 0;
    const linhas = await this.leituras(conta, 0);
    for (const l of linhas) await bdApagar('leituras', l.id);
    return linhas.length;
  },

  /* ---------- migração ----------
     Traz o que estava em localStorage e marca para não repetir. */
  async migrarDoLocalStorage() {
    let marca;
    try { marca = localStorage.getItem('solaris.migrado.v1'); } catch (e) { return; }
    if (marca) return;

    try {
      /* contas */
      const raw = localStorage.getItem('solaris.contas.v1');
      if (raw) {
        const todas = JSON.parse(raw);
        for (const id of Object.keys(todas)) await this.salvarConta(todas[id]);
      }
      /* estados: solaris.v2, solaris.v2.<conta> */
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || k.indexOf('solaris.v2') !== 0) continue;
        const conta = k === 'solaris.v2' ? 'visitante' : k.slice('solaris.v2.'.length);
        const dados = JSON.parse(localStorage.getItem(k));
        const jaTem = await this.estado(conta);
        if (!jaTem) await this.salvarEstado(conta, dados);
      }
      localStorage.setItem('solaris.migrado.v1', String(Date.now()));
    } catch (e) { /* migração é conveniência, não pode quebrar a abertura */ }
  },

  /* números para mostrar em Configurações */
  async estatisticas() {
    const nContas = (await this.contas()).length;
    const nLeituras = await this.contarLeituras();
    let bytes = null;
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const e = await navigator.storage.estimate();
        bytes = e.usage || null;
      }
    } catch (e) { }
    return {
      motor: this.usandoIndexedDB ? 'IndexedDB' : 'localStorage (reserva)',
      contas: nContas, leituras: nLeituras, bytes: bytes,
      janelaDias: DIAS_HISTORICO, intervaloSeg: INTERVALO_LEITURA
    };
  }
};


/* ===== js/motor.js ===== */
/* motor.js — onde os numeros nascem

   Este e o coracao do projeto e a parte que a banca vai questionar. Nada
   aqui e digitado: tudo e calculado.

   O que ele faz, em ordem:

   1. Descobre onde o sol esta. A declinacao solar depende da data, entao a
      janela de luz encurta no inverno sozinha, sem ninguem mexer.

   2. Poe nuvem no ceu. Um gerador de ruido com semente fixa: o dia 12 de
      junho sempre tem o mesmo tempo, mas cada dia e diferente do outro.
      Isso deixa a simulacao realista e reproduzivel ao mesmo tempo.

   3. Cruza geracao e consumo hora a hora. O que o painel gera e a casa usa
      na mesma hora e autoconsumo; o que sobra vai para a rede; o que falta
      vem da rede. Somando as 24 horas sai o mes.

   4. Faz a conta de luz de verdade. Compensa credito mes a mes, respeita o
      minimo faturavel (que credito nao abate) e cobra o Fio B da Lei
      14.300 sobre a energia compensada.

   5. Reparte o consumo entre os aparelhos. Cada aparelho tem uma fatia do
      medidor, e as horas de uso sao deduzidas dela. Por isso o ranking
      sempre fecha com a leitura, nunca sobra nem falta.

   Aqui tambem mora o estado do site (o objeto S) e a gravacao no banco.
*/
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const soma = a => a.reduce((x, y) => x + y, 0);

const nf = (v, d) => Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const brl = (v, d) => 'R$ ' + nf(v, d === undefined ? 0 : d);
const pct = (v, d) => nf(v, d === undefined ? 0 : d) + '%';
const sinal = (v, d) => (v >= 0 ? '+' : '−') + nf(Math.abs(v), d === undefined ? 0 : d);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Lê número digitado em português. O ponto é ambíguo: em "1.05" é decimal,
   em "26.000" é milhar. A regra que resolve:
   - se há vírgula, ela é o decimal e todo ponto é milhar;
   - sem vírgula, pontos só são milhar quando separam grupos de três dígitos. */
function numeroBR(txt) {
  const t = String(txt == null ? '' : txt).trim().replace(/\s/g, '');
  if (!t) return 0;
  let limpo;
  if (t.indexOf(',') >= 0) limpo = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) limpo = t.replace(/\./g, '');
  else limpo = t;
  const n = Number(limpo);
  return isFinite(n) ? n : 0;
}

/* ruído semeado — o mesmo dia sempre gera o mesmo tempo */
function semente(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function ruido(chave) {
  let a = semente(chave) | 0;
  a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
/* ruído suave: interpola entre âncoras a cada 4 passos */
function suave(chave, i, passo) {
  const p = passo || 4, base = Math.floor(i / p), t = (i % p) / p;
  const a = ruido(chave + ':' + base), b = ruido(chave + ':' + (base + 1));
  const s = t * t * (3 - 2 * t);
  return a + (b - a) * s;
}

/* ---------- sol: janela de luz calculada pela data ---------- */
function diaDoAno(d) {
  return Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}
function janelaSolar(d) {
  const decl = 0.4093 * Math.sin(2 * Math.PI * (284 + diaDoAno(d)) / 365);
  const ha = Math.acos(clamp(-Math.tan(LAT) * Math.tan(decl), -1, 1));
  const meio = 12.2, meiaJornada = ha * 12 / Math.PI;
  return { nascer: meio - meiaJornada, por: meio + meiaJornada, meio: meio };
}
/* forma horária da geração: 24 pesos somando 1 */
function formaSolar(d) {
  const j = janelaSolar(d), out = [];
  for (let hr = 0; hr < 24; hr++) {
    const t = hr + 0.5;
    if (t <= j.nascer || t >= j.por) { out.push(0); continue; }
    const x = (t - j.nascer) / (j.por - j.nascer);
    out.push(Math.pow(Math.sin(Math.PI * x), 1.28));
  }
  const t = soma(out) || 1;
  return out.map(v => v / t);
}
/* nuvens do dia: 0,25 (fechado) a 1,05 (céu limpo) */
function tempoDoDia(chave, d) {
  const idx = Math.round(d.getTime() / 86400000);
  let c = 0.48 + 0.57 * suave(chave + '|ceu', idx, 3);
  if (ruido(chave + '|chuva' + idx) < 0.13) c *= 0.42;
  return clamp(c, 0.18, 1.06);
}

/* ---------- mês simulado (memoizado) ---------- */
const _cacheMes = new Map();
function mesSimulado(chave, y, m) {
  const ck = chave + '|' + y + '|' + m;
  if (_cacheMes.has(ck)) return _cacheMes.get(ck);
  const u = uni(chave), nd = diasNoMes(y, m);

  const sazG = 1 + 0.19 * Math.cos(2 * Math.PI * (m - 11) / 12);
  const sazC = 1 + 0.15 * Math.cos(2 * Math.PI * m / 12);
  const alvoG = u.geracaoMes * sazG, alvoC = u.consumoMes * sazC;

  const formaC = u.consumoH.slice(), somaFC = soma(formaC);
  const brutoG = [], brutoC = [], formasG = [];
  for (let i = 0; i < nd; i++) {
    const d = new Date(y, m, i + 1);
    formasG.push(formaSolar(d));
    brutoG.push(tempoDoDia(chave, d));
    const idx = Math.round(d.getTime() / 86400000);
    brutoC.push((0.87 + 0.27 * suave(chave + '|uso', idx, 3)) * u.semana[d.getDay()]);
  }
  const kG = alvoG / (soma(brutoG) || 1), kC = alvoC / (soma(brutoC) || 1);

  const dias = [];
  for (let i = 0; i < nd; i++) {
    const totG = brutoG[i] * kG, totC = brutoC[i] * kC;
    const ger = formasG[i].map(v => v * totG);
    const idx = Math.round(new Date(y, m, i + 1).getTime() / 86400000);
    let cons = formaC.map((v, hr) => (v / somaFC) * totC * (0.9 + 0.2 * ruido(chave + '|h' + idx + '_' + hr)));
    const kk = totC / (soma(cons) || 1);
    cons = cons.map(v => v * kk);
    let auto = 0, inj = 0, rede = 0;
    for (let hr = 0; hr < 24; hr++) {
      auto += Math.min(cons[hr], ger[hr]);
      inj += Math.max(0, ger[hr] - cons[hr]);
      rede += Math.max(0, cons[hr] - ger[hr]);
    }
    dias.push({ dia: i + 1, dow: new Date(y, m, i + 1).getDay(), cons: cons, ger: ger, tc: totC, tg: totG, auto: auto, inj: inj, rede: rede });
  }
  const r = {
    y: y, m: m, nd: nd, dias: dias,
    tc: soma(dias.map(d => d.tc)), tg: soma(dias.map(d => d.tg)),
    auto: soma(dias.map(d => d.auto)), inj: soma(dias.map(d => d.inj)), rede: soma(dias.map(d => d.rede))
  };
  _cacheMes.set(ck, r);
  return r;
}

/* soma parcial de um mês até "horas" decorridas */
function ate(md, horas) {
  const r = { tc: 0, tg: 0, auto: 0, inj: 0, rede: 0, dias: 0 };
  if (horas == null) horas = md.nd * 24;
  for (let i = 0; i < md.nd; i++) {
    const d = md.dias[i];
    const ini = i * 24;
    if (ini >= horas) break;
    const fim = Math.min(24, horas - ini);
    if (fim >= 24) { r.tc += d.tc; r.tg += d.tg; r.auto += d.auto; r.inj += d.inj; r.rede += d.rede; r.dias++; continue; }
    for (let hr = 0; hr < 24; hr++) {
      const f = clamp(fim - hr, 0, 1);
      if (f <= 0) break;
      const c = d.cons[hr] * f, g = d.ger[hr] * f;
      r.tc += c; r.tg += g;
      r.auto += Math.min(c, g); r.inj += Math.max(0, g - c); r.rede += Math.max(0, c - g);
    }
    r.dias += fim / 24;
  }
  return r;
}

/* data em que a unidade entrou em operação, deduzida dos meses de operação */
function inicioOperacao(chave) {
  const u = uni(chave), d = agora();
  return new Date(d.getFullYear(), d.getMonth() - (u.mesesOperacao - 1), 1);
}
function temDireitoAdquirido(chave) {
  return inicioOperacao(chave) <= CORTE_DIREITO_ADQUIRIDO;
}
/* Dois patamares diferentes, e a distinção importa:
   - potencial da região: o que um telhado ideal (voltado ao norte, sem sombra)
     entregaria com essa potência instalada;
   - esperado: o que ESTE telhado entrega, dada orientação e sombreamento.
   Comparar a geração real contra o esperado mede saúde operacional (sujeira,
   inversor, falha). Comparar contra o potencial mede qualidade da instalação. */
function potencialRegiao(chave, m, nd) {
  const u = uni(chave);
  return u.potenciaKwp * IRRADIACAO_SP[m] * RAZAO_DESEMPENHO * nd;
}
function geracaoEsperada(chave, m, nd) {
  return potencialRegiao(chave, m, nd) * uni(chave).fatorInstalacao;
}

/* ---------- livro de créditos: compensação mês a mês ---------- */
const _cacheLedger = new Map();
function ledger(chave, ate_y, ate_m, horasUltimo) {
  const ck = chave + '|' + ate_y + '|' + ate_m + '|' + (horasUltimo == null ? 'cheio' : Math.floor(horasUltimo));
  if (_cacheLedger.has(ck)) return _cacheLedger.get(ck);
  const u = uni(chave);
  const fim = ate_y * 12 + ate_m;
  const ini = fim - (u.mesesOperacao - 1);
  const adq = temDireitoAdquirido(chave);
  let creditos = 0, economiaTotal = 0, fioBTotal = 0;
  const linhas = [];
  for (let k = ini; k <= fim; k++) {
    const y = Math.floor(k / 12), m = k - y * 12;
    const md = mesSimulado(chave, y, m);
    const p = (k === fim) ? ate(md, horasUltimo) : ate(md, null);
    creditos += p.inj;
    /* o mínimo faturável (custo de disponibilidade) nunca é abatido por crédito */
    const usado = Math.min(creditos, Math.max(0, p.rede - u.minFatura));
    creditos -= usado;
    const faturado = p.rede - usado;

    /* Lei 14.300: paga-se Fio B sobre a energia compensada */
    const perc = percentualFioB(y, adq);
    const fioB = usado * u.fioB * perc;
    fioBTotal += fioB;

    /* economia real = energia que deixou de ser comprada, menos o Fio B */
    const economia = (p.auto + usado) * u.tarifa - fioB;
    economiaTotal += economia;

    linhas.push({
      y: y, m: m, k: k, cons: p.tc, ger: p.tg, auto: p.auto, inj: p.inj, rede: p.rede,
      usado: usado, faturado: faturado, fioB: fioB, percFioB: perc,
      economia: economia, creditos: creditos
    });
  }
  const r = { linhas: linhas, creditos: creditos, economiaTotal: economiaTotal, fioBTotal: fioBTotal, direitoAdquirido: adq };
  _cacheLedger.set(ck, r);
  return r;
}
