<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solaris</title>
<meta name="description" content="Painel de monitoramento de energia solar com medidor ao vivo, desagregacao por aparelho e metas.">
<meta name="theme-color" content="#16150F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316150F'/%3E%3Ccircle cx='50' cy='50' r='15' fill='none' stroke='%23EDA22B' stroke-width='4.5'/%3E%3Cg stroke='%23F5C25B' stroke-width='4.5' stroke-linecap='round'%3E%3Cpath d='M50 23v7M50 70v7M77 50h-7M30 50h-7M69 31l-5 5M36 64l-5 5M69 69l-5-5M36 36l-5-5'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============================================================
   SOLARIS - sistema de design
   Um unico mundo visual: papel quente, tinta oliva, sol ambar.
   Todas as cores sao pintadas explicitamente.
   ============================================================ */
:root{
  --ground:#EFEBE1;
  --ground-2:#F7F4EC;
  --surface:#FFFFFF;
  --dark:#16150F;
  --dark-2:#211F17;
  --ink:#16150F;
  --ink-2:#4A453B;
  --muted:#5F5A50;
  --faint:#6B665C;
  --fainter:#7A7467;
  --line:#E3DED2;
  --line-2:#DDD7C9;
  --on-dark:#F4F1EA;
  --on-dark-soft:#A79F8E;
  --on-dark-faint:#8E887A;

  --sun:#EDA22B;
  --sun-lite:#F5C25B;
  --sun-deep:#B4761B;
  --sun-deeper:#8A5810;

  --grid:#3E4C7A;
  --good:#2E7A5A;
  --good-soft:#93C7AC;
  --good-bg:#E4F0EA;
  --good-line:#C3DFD1;
  --good-on-dark:#6FD6A4;
  --warn:#8A6A15;
  --warn-bg:#FBF0CF;
  --warn-line:#EDDCA8;
  --bad:#C4573C;
  --bad-soft:#E0A79A;
  --bad-bg:#FBECE8;
  --bad-line:#EFCFC6;
  --violet:#7A6BA8;
  --teal:#4E8FA8;

  --r-lg:20px; --r-md:15px; --r-sm:11px;
  --shadow:0 1px 3px rgba(22,21,15,.08);
  --shadow-lift:0 14px 40px -18px rgba(22,21,15,.42);

  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--sun-deep);outline-offset:2px;border-radius:6px}
.pular{
  position:absolute;left:12px;top:-64px;z-index:300;
  background:var(--dark);color:var(--on-dark);padding:11px 18px;border-radius:11px;
  font-size:13.5px;font-weight:600;text-decoration:none;transition:top .18s;
}
.pular:focus{top:12px}
#conteudo:focus{outline:none}
.chart:focus-visible,.hbars:focus-visible{outline:2px solid var(--sun-deep);outline-offset:4px;border-radius:10px}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D8D2C4;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#C4BDAA;background-clip:content-box}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.05px;color:var(--faint)}
.eyebrow-sm{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--fainter)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- casca ---------- */
.app{display:flex;min-height:100vh;background:var(--ground)}

.rail{
  width:244px;flex-shrink:0;background:var(--dark);color:var(--on-dark);
  display:flex;flex-direction:column;padding:22px 0 18px;
  position:sticky;top:0;height:100vh;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 22px 24px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(150deg,var(--sun-lite),#E08A18);
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{animation:spin 40s linear infinite}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.4px;line-height:1}
.brand-sub{font-size:10.5px;color:var(--on-dark-faint);letter-spacing:.5px;text-transform:uppercase;margin-top:3px}

.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:500;
  color:var(--on-dark-soft);transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(244,241,234,.08);color:var(--on-dark)}
.nav-item[aria-current="page"]{background:rgba(237,162,43,.16);color:var(--sun-lite);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;
  border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;
}

.rail-spacer{flex:1;min-height:14px}
.rail-foot{padding:0 12px;display:flex;flex-direction:column;gap:10px}
.unitbox{background:rgba(244,241,234,.06);border:1px solid rgba(244,241,234,.1);border-radius:14px;padding:13px}
.unitbox-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--on-dark-faint);margin-bottom:9px}
.unit{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:9px;color:var(--on-dark-soft);transition:background .15s}
.unit:hover{background:rgba(244,241,234,.1)}
.unit[aria-pressed="true"]{background:rgba(244,241,234,.12);color:var(--on-dark)}
.unit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#4A453B}
.unit[aria-pressed="true"] .unit-dot{background:var(--sun)}
.unit-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-type{font-size:10.5px;color:var(--on-dark-faint)}

.meter{border:1px solid rgba(244,241,234,.1);border-radius:14px;padding:12px 13px 13px;background:rgba(244,241,234,.04)}
.meter-head{display:flex;align-items:center;gap:7px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--on-dark-faint)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good-on-dark);flex-shrink:0;animation:beat 2.4s ease-in-out infinite}
.meter-rows{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.meter-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--on-dark-soft)}
.meter-val{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--on-dark);font-variant-numeric:tabular-nums}
.meter-bar{height:4px;border-radius:3px;background:rgba(244,241,234,.12);overflow:hidden;margin-top:10px}
.meter-bar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--sun),var(--sun-lite));transition:width .9s cubic-bezier(.4,0,.2,1)}
.meter-note{font-size:10.5px;color:var(--on-dark-faint);margin-top:8px;line-height:1.35}

/* ---------- area principal ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:24px 34px 18px;border-bottom:1px solid var(--line);
  background:rgba(239,235,225,.9);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-weight:700;font-size:30px;letter-spacing:-.9px;line-height:1.05}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:#E5E0D3;border-radius:10px;padding:3px}
.seg button{padding:6px 15px;border-radius:8px;font-size:12.5px;font-weight:600;color:#7A7466;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .short{display:none}
.ghost-btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,color .15s;
}
.ghost-btn:hover{border-color:var(--ink);color:var(--ink)}
.dark-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;
  background:var(--dark);color:var(--on-dark);font-size:13px;font-weight:600;transition:background .15s,opacity .15s;
}
.dark-btn:hover{background:var(--dark-2)}
.dark-btn[disabled]{background:var(--line-2);color:#9C9585;cursor:not-allowed}
.link-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sun-deep);transition:color .15s}
.link-btn:hover{color:var(--sun-deeper)}

.page{padding:24px 34px 64px}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 26px}
.card--tight{padding:18px 20px 16px;border-radius:18px}
.card--dark{background:var(--dark);color:var(--on-dark);border-color:transparent;position:relative;overflow:hidden}
.card h2{font-weight:600;font-size:19px;letter-spacing:-.5px}
.card-sub{font-size:12.5px;color:var(--faint);margin-top:4px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.swatch{width:14px;height:3px;border-radius:2px;flex-shrink:0}
.swatch--sq{width:10px;height:10px;border-radius:3px}
.rule{height:1px;background:var(--ground);border:0;margin:16px 0 13px}

.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill--warn{background:var(--warn-bg);color:var(--warn)}
.pill--good{background:var(--good-bg);color:var(--good)}
.pill--bad{background:var(--bad-bg);color:var(--bad)}
.pill--neutral{background:var(--ground);color:var(--faint)}
.pill--ia{display:inline-flex;align-items:center;gap:4px;background:#F0E9DA;color:#99722A;font-size:10.5px;letter-spacing:.3px;padding:3px 8px;border-radius:20px;font-weight:600}

.big{font-family:var(--f-display);font-weight:700;letter-spacing:-1.3px;line-height:1}
.big-30{font-size:30px;letter-spacing:-1.2px}
.big-32{font-size:32px}
.big-34{font-size:34px;letter-spacing:-1.5px}
.big-40{font-size:40px;letter-spacing:-1.8px}
.big-46{font-size:46px;letter-spacing:-2px}
.big-74{font-size:74px;letter-spacing:-3.4px;line-height:.86}

/* ---------- painel: heroi da economia ---------- */
.hero{padding:26px 28px 22px}
.hero-glow{
  position:absolute;top:-70px;right:-50px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(237,162,43,.35),transparent 68%);
  animation:pulse 6s ease-in-out infinite;pointer-events:none;
}
.hero-in{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero-kicker{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--on-dark-soft)}
.delta{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 10px;
  font-size:12px;font-weight:600;background:rgba(74,196,140,.16);color:var(--good-on-dark);
}
.delta--down{background:rgba(196,87,60,.18);color:#E9A392}
.delta svg{transition:transform .2s}
.delta--down svg{transform:rotate(180deg)}
.hero-money{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.hero-cur{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--on-dark-soft)}
.hero-line{font-size:13.5px;color:var(--on-dark-soft);margin-top:14px;max-width:430px;line-height:1.5}
.spark{display:flex;align-items:flex-end;gap:5px;height:80px;margin-top:22px}
.spark-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.spark-bar{width:100%;border-radius:4px 4px 2px 2px;background:rgba(244,241,234,.16);transition:background .2s,height .5s cubic-bezier(.4,0,.2,1)}
.spark-col:hover .spark-bar{background:rgba(244,241,234,.34)}
.spark-col.is-now .spark-bar{background:var(--sun)}
.spark-lbl{font-family:var(--f-mono);font-size:9.5px;color:var(--on-dark-faint)}
.spark-col.is-now .spark-lbl{color:var(--sun)}

/* ---------- donut ---------- */
.donut-wrap{display:flex;align-items:center;gap:22px;margin-top:14px;flex-wrap:wrap}
.donut{position:relative;width:132px;height:132px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut-ring{transition:stroke-dasharray 1s cubic-bezier(.4,0,.2,1)}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-pct{font-family:var(--f-display);font-weight:700;font-size:33px;letter-spacing:-1.4px;line-height:1}
.donut-cap{font-size:10.5px;color:var(--faint);letter-spacing:.4px}
.split{display:flex;flex-direction:column;gap:13px;min-width:0}
.split-row-top{display:flex;align-items:center;gap:7px}
.split-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.split-lbl{font-size:12px;color:var(--muted)}
.split-val{font-family:var(--f-mono);font-size:17px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- kpi ---------- */
.kpi-top{display:flex;align-items:center;gap:8px}
.kpi-lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi-val{display:flex;align-items:baseline;gap:5px;margin-top:11px}
.kpi-unit{font-size:13px;color:var(--faint);font-weight:500}
.kpi-note{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.4}

/* ---------- graficos ---------- */
.chart{position:relative;margin-top:16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart-axis{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--fainter)}
.now-line{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.now-dot{animation:beat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tip{
  position:absolute;z-index:40;pointer-events:none;opacity:0;transform:translate(-50%,-116%);
  background:var(--dark);color:var(--on-dark);border-radius:10px;padding:8px 11px;
  font-size:11.5px;line-height:1.45;white-space:nowrap;box-shadow:var(--shadow-lift);
  transition:opacity .12s;
}
.tip.on{opacity:1}
.tip b{font-family:var(--f-mono);font-weight:500;color:var(--sun-lite)}
.tip i{font-style:normal;font-family:var(--f-mono);color:#9FB0DD}

/* barras de historico */
.hbars{display:flex;align-items:flex-end;gap:4px;margin-top:22px}
.hbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;cursor:default}
.hbar-pair{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%}
.hbar-pair i{display:block;width:100%;border-radius:3px 3px 0 0;transition:height .45s cubic-bezier(.4,0,.2,1),opacity .15s}
.hbar-c{background:var(--grid)}
.hbar-g{background:var(--sun)}
.hbar:hover .hbar-pair i{opacity:.78}
.hbar-saldo{width:100%;height:4px;border-radius:2px}
.hbar-lbl{font-family:var(--f-mono);font-size:9.5px;color:var(--fainter);height:12px;white-space:nowrap}

.compare-lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.track{height:12px;background:#F4F1EA;border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1)}

.note{display:flex;gap:13px;padding:14px 16px;border-radius:14px}
.note-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.note-t{font-size:13.5px;font-weight:600}
.note-s{font-size:12.5px;margin-top:3px}
.note--good{background:var(--good-bg)}
.note--good .note-dot{background:var(--good)}
.note--good .note-s{color:#4A6B5C}
.note--bad{background:var(--bad-bg)}
.note--bad .note-dot{background:var(--bad)}
.note--bad .note-s{color:#8A5040}
.note--sun{background:var(--ground-2)}
.note--sun .note-dot{background:var(--sun)}
.note--sun .note-s{color:var(--muted)}

/* ---------- para onde vai a energia ---------- */
.mixbar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin-top:18px;gap:2px}
.mixbar i{display:block;transition:width .5s cubic-bezier(.4,0,.2,1)}
.mixbar i:hover{filter:brightness(1.12)}
.toplist{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.toprow{display:flex;align-items:center;gap:13px;width:100%;padding:9px 10px;border-radius:11px;transition:background .13s}
.toprow:hover{background:var(--ground-2)}
.toprow-bar{width:10px;height:34px;border-radius:5px;flex-shrink:0}
.toprow-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow-sub{font-size:11.5px;color:var(--faint)}
.toprow-num{font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.toprow-cash{font-size:11px;color:var(--faint)}

/* ---------- tabela de aparelhos ---------- */
.eq-head,.eq-row{display:grid;grid-template-columns:28px minmax(0,1fr) 96px 84px 58px 32px;gap:12px;align-items:center}
.eq-head{padding:0 14px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--fainter);border-bottom:1px solid var(--ground)}
.eq-list{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.eq-row{
  width:100%;padding:13px 14px;border-radius:13px;border:1px solid transparent;transition:background .13s,border-color .13s;
}
.eq-row:hover{background:var(--ground-2)}
.eq-row[aria-expanded="true"]{background:var(--surface);border-color:var(--ink)}
.eq-pos{font-family:var(--f-mono);font-size:12px;color:var(--fainter)}
.eq-name{display:flex;align-items:center;gap:8px;min-width:0}
.eq-name b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-meta{font-size:11.5px;color:var(--faint);margin-top:2px}
.eq-track{height:8px;background:#F4F1EA;border-radius:4px;overflow:hidden}
.eq-track i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.eq-pct{font-size:11px;color:var(--faint);margin-top:4px}
.eq-kwh{font-family:var(--f-mono);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.eq-cash{font-size:11px;color:var(--faint)}
.eq-trend{font-family:var(--f-mono);font-size:11.5px;font-weight:500}
.eq-kill{opacity:0;color:var(--fainter);padding:4px;border-radius:8px;transition:opacity .13s,color .13s,background .13s}
.eq-row:hover .eq-kill,.eq-kill:focus-visible{opacity:1}
.eq-kill:hover{color:var(--bad);background:var(--bad-bg)}

.detect{display:flex;align-items:center;gap:16px;background:var(--dark);color:var(--on-dark);border-radius:16px;padding:16px 20px;flex-wrap:wrap}
.detect-ic{width:36px;height:36px;border-radius:12px;background:rgba(237,162,43,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detect-t{font-size:14px;font-weight:600}
.detect-s{font-size:12.5px;color:var(--on-dark-soft);margin-top:3px}
.detect-btns{display:flex;gap:8px;flex-shrink:0}
.btn-no{padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid rgba(244,241,234,.24);color:var(--on-dark-soft);transition:color .15s,border-color .15s}
.btn-no:hover{color:var(--on-dark);border-color:var(--on-dark)}
.btn-yes{padding:8px 15px;border-radius:10px;font-size:13px;font-weight:600;background:var(--sun);color:var(--dark);transition:background .15s}
.btn-yes:hover{background:var(--sun-lite)}

.empty{background:var(--ground-2);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:34px 26px;text-align:center}
.empty-t{font-size:14px;font-weight:600;color:var(--muted);margin-top:12px}
.empty-s{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.5}

.det-head{display:flex;align-items:flex-start;gap:14px}
.det-chip{width:46px;height:46px;border-radius:14px;flex-shrink:0}
.det-name{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.5px;line-height:1.15}
.det-loc{font-size:12.5px;color:var(--faint);margin-top:3px}
.det-x{color:var(--fainter);padding:2px;transition:color .15s}
.det-x:hover{color:var(--ink)}
.det-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.fact{background:var(--ground-2);border-radius:12px;padding:11px 13px}
.fact-k{font-size:11px;color:var(--faint)}
.fact-v{font-family:var(--f-mono);font-size:15px;font-weight:500;margin-top:3px}
.prof{display:flex;align-items:flex-end;gap:2px;height:54px}
.prof i{display:block;flex:1;border-radius:2px 2px 0 0;transition:height .4s cubic-bezier(.4,0,.2,1)}
.tips{display:flex;flex-direction:column;gap:11px}
.tip-row{display:flex;gap:10px}
.tip-row svg{flex-shrink:0;margin-top:2px}
.tip-txt{font-size:13px;line-height:1.45}
.tip-txt b{font-weight:600}
.tip-txt span{color:var(--muted)}

/* ---------- formulario ---------- */
.field{margin-top:20px}
.field:first-of-type{margin-top:22px}
.field-lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.text-in{
  width:100%;height:44px;margin-top:7px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line-2);background:#FCFBF7;font-family:var(--f-body);font-size:14px;color:var(--ink);outline:none;
  transition:border-color .15s;
}
.text-in:focus{border-color:var(--ink)}
.text-in::placeholder{color:var(--fainter)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.chip{
  padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:500;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);transition:all .13s;
}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-dark)}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slider-val{font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--sun);cursor:pointer;height:22px}
.slider-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--fainter);margin-top:2px}
.sliders{display:flex;flex-direction:column;gap:20px}
.est-bar{height:10px;background:rgba(244,241,234,.12);border-radius:5px;overflow:hidden;margin-top:20px}
.est-bar i{display:block;height:100%;border-radius:5px;background:var(--sun);transition:width .4s cubic-bezier(.4,0,.2,1)}
.saved{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--good-on-dark)}
.preset{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 11px;border-radius:11px;transition:background .13s}
.preset:hover{background:var(--ground-2)}
.preset-n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset-d{font-size:11.5px;color:var(--faint);margin-top:2px}

/* ---------- alertas ---------- */
.goal-track{position:relative;height:14px;background:#F4F1EA;border-radius:7px;margin-top:22px}
.goal-fill{height:100%;border-radius:7px;transition:width .5s cubic-bezier(.4,0,.2,1),background .3s}
.goal-mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.goal-mark::after{content:attr(data-l);position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--faint);white-space:nowrap;font-family:var(--f-mono)}
.rule-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:12px;transition:background .13s}
.rule-row:hover{background:var(--ground-2)}
.rule-t{font-size:13.5px;font-weight:600;line-height:1.35}
.rule-s{font-size:11.5px;color:var(--faint);margin-top:3px}
.tog{width:42px;height:24px;border-radius:14px;flex-shrink:0;padding:3px;display:flex;transition:background .18s,justify-content .18s;background:var(--line-2);justify-content:flex-start}
.tog[aria-pressed="true"]{background:var(--good);justify-content:flex-end}
.tog i{display:block;width:18px;height:18px;border-radius:50%;background:#fff}
.feed{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.feed-item{display:flex;gap:13px;padding:15px 17px;border-radius:15px;border:1px solid}
.feed-item--alto{background:var(--bad-bg);border-color:var(--bad-line)}
.feed-item--alto .feed-dot{background:var(--bad)}
.feed-item--medio{background:var(--warn-bg);border-color:var(--warn-line)}
.feed-item--medio .feed-dot{background:var(--warn)}
.feed-item--bom{background:var(--good-bg);border-color:var(--good-line)}
.feed-item--bom .feed-dot{background:var(--good)}
.feed-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.feed-t b{font-size:14px;font-weight:600}
.feed-t span{font-size:11.5px;color:var(--faint)}
.feed-x{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.5;max-width:78ch}
.feed-close{
  flex-shrink:0;align-self:flex-start;padding:5px;border-radius:8px;color:var(--faint);
  opacity:.55;transition:opacity .13s,background .13s,color .13s;
}
.feed-item:hover .feed-close,.feed-close:focus-visible{opacity:1}
.feed-close:hover{background:rgba(22,21,15,.07);color:var(--ink)}

/* ---------- relatorio ---------- */
.inv-head,.inv-row{display:grid;grid-template-columns:1fr 150px 130px;gap:12px}
.inv-head{margin-top:26px;padding-bottom:9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--fainter)}
.inv-row{padding:11px 0;border-top:1px solid var(--ground);font-size:13.5px}
.inv-row--total{padding:16px 0 4px;border-top:1px solid var(--ink);font-size:15px;font-weight:700}
.inv-row--credit{color:var(--good)}
.inv-q{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.inv-v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.leaf{display:flex;gap:14px;background:var(--good-bg);border-radius:var(--r-md);padding:18px 20px;margin-top:24px}
.leaf-t{font-size:14px;font-weight:600;color:#235C44}
.leaf-s{font-size:13px;color:#3E6B57;margin-top:4px;line-height:1.5}
.ybars{display:flex;align-items:flex-end;gap:4px;height:104px;margin-top:18px}
.ybar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ybar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:#E0DACC;transition:height .5s cubic-bezier(.4,0,.2,1)}
.ybar.is-now i{background:var(--sun)}
.ybar span{font-family:var(--f-mono);font-size:9px;color:var(--fainter)}

/* ---------- config ---------- */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:18px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.kv dd.mono{font-weight:500}
.kvs{display:flex;flex-direction:column;gap:13px;margin:0}
.softbox{background:var(--ground-2);border-radius:14px;padding:15px 17px;margin-top:20px;font-size:12.5px;color:var(--muted);line-height:1.5}
.softbox b{color:var(--ink);font-weight:600}
.unit--nova{color:var(--on-dark-faint);border:1px dashed rgba(244,241,234,.2);margin-top:4px;justify-content:center;gap:7px}
.unit--nova:hover{color:var(--on-dark);border-color:rgba(244,241,234,.45)}
.unit--nova .unit-name{font-weight:600;font-size:12px}

.un-list{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.un-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;transition:background .13s}
.un-row:hover{background:var(--ground-2)}
.un-row>span:first-child{flex:1;min-width:0}
.un-meta{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}

.dica{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45;max-width:56ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{
  display:block;width:100%;padding:13px 15px;border-radius:13px;text-align:left;
  border:1px solid var(--line-2);background:var(--surface);transition:border-color .13s,background .13s;
}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ground-2)}
.opt-t{display:block;font-size:13.5px;font-weight:600}
.opt-d{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}

.danger-btn{font-size:12.5px;font-weight:600;color:var(--bad);transition:color .15s}
.danger-btn:hover{color:#8A3A25}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 40px))}
.toast{
  display:flex;gap:11px;background:var(--dark);color:var(--on-dark);border-radius:14px;padding:13px 15px;
  box-shadow:var(--shadow-lift);animation:slidein .32s cubic-bezier(.16,1,.3,1);
}
.toast.out{animation:slideout .28s ease forwards}
.toast-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:var(--sun)}
.toast--good .toast-dot{background:var(--good-on-dark)}
.toast--bad .toast-dot{background:#E9A392}
.toast-t{font-size:13px;font-weight:600}
.toast-s{font-size:12px;color:var(--on-dark-soft);margin-top:3px;line-height:1.45}

/* ---------- animacoes ---------- */
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.06)}}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.42;transform:scale(.82)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(24px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.enter>*{animation:fadeup .34s cubic-bezier(.16,1,.3,1) backwards}
.enter>*:nth-child(1){animation-delay:.01s}
.enter>*:nth-child(2){animation-delay:.04s}
.enter>*:nth-child(3){animation-delay:.07s}
.enter>*:nth-child(4){animation-delay:.1s}
.enter>*:nth-child(5){animation-delay:.13s}
.enter>*:nth-child(6){animation-delay:.16s}
.enter>*:nth-child(n+7){animation-delay:.19s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================
   APP MOBILE - a mesma logica, outra casca
   ============================================================ */
/* o palco escuro precisa cobrir a janela inteira; o body acompanha
   para não sobrar faixa creme embaixo em telas curtas */
body.vista-celular{background:var(--dark)}
.phone-stage{
  min-height:100vh;min-height:100dvh;background:var(--dark);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:36px 20px;
}
.phone-back{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;
  border:1px solid rgba(244,241,234,.2);color:var(--on-dark-soft);font-size:13px;font-weight:600;transition:all .15s;
}
.phone-back:hover{color:var(--on-dark);border-color:var(--on-dark)}
.phone{
  width:393px;height:852px;max-height:calc(100vh - 130px);border-radius:48px;
  background:#0A0A0A;padding:11px;box-shadow:0 0 0 2px #2B2B2B,0 34px 70px -24px rgba(0,0,0,.85);
  position:relative;flex-shrink:0;
}
.phone-screen{width:100%;height:100%;border-radius:38px;overflow:hidden;position:relative;background:var(--ground)}
.phone-island{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:126px;height:37px;border-radius:24px;background:#000;z-index:60;pointer-events:none;
}
.phone-home{
  position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:139px;height:5px;border-radius:100px;background:rgba(22,21,15,.32);z-index:60;pointer-events:none;
}

.mob{display:flex;flex-direction:column;height:100%;background:var(--ground);color:var(--ink)}
.mob-head{padding:58px 20px 12px;flex-shrink:0;background:var(--ground)}
.mob-back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--sun-deep);margin-bottom:6px}
.mob-unit{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint)}
.mob-title{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.8px;margin-top:3px}
.mob-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 22px;-webkit-overflow-scrolling:touch}
.mob-col{display:flex;flex-direction:column;gap:12px}
.mob-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 17px}
.mob-hero{background:var(--dark);color:var(--on-dark);border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden}
.mob-hero .hero-glow{width:170px;height:170px;top:-56px;right:-40px}
.mob-hero-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--on-dark-soft)}
.mob-hero-v{display:flex;align-items:baseline;gap:7px;margin-top:8px}
.mob-hero-v .cur{font-family:var(--f-display);font-size:21px;color:var(--on-dark-soft)}
.mob-hero-v .num{font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:-2px;line-height:.9}
.mob-hero-s{font-size:12.5px;color:var(--on-dark-soft);margin-top:10px;line-height:1.45}
.mob-live{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(244,241,234,.12);font-size:11.5px;color:var(--on-dark-soft)}
.mob-live b{font-family:var(--f-mono);font-weight:500;color:var(--on-dark)}
.mob-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mob-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.mob-tile-k{font-size:11px;color:var(--faint)}
.mob-tile-v{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-1px;margin-top:5px;line-height:1}
.mob-tile-s{font-size:10.5px;color:var(--fainter);margin-top:3px}
.mob-seg{display:flex;background:#E5E0D3;border-radius:11px;padding:3px}
.mob-seg button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:#7A7466;text-align:center}
.mob-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mob-rowline{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-top:1px solid var(--ground)}
.mob-rowline:first-child{border-top:0}
.mob-rowline span:first-child{color:var(--muted)}
.mob-menu{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;transition:border-color .15s}
.mob-menu:hover{border-color:var(--ink)}
.mob-menu-ic{width:36px;height:36px;border-radius:12px;background:var(--ground-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mob-menu-t{font-size:13.5px;font-weight:600}
.mob-menu-s{font-size:11.5px;color:var(--faint);margin-top:2px}
.mob-tabs{
  display:flex;flex-shrink:0;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 4px 20px;
}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 2px;min-width:0;color:#9C9585;transition:color .15s}
.mob-tab[aria-current="page"]{color:var(--sun-deep)}
.mob-tab span{font-size:10px;font-weight:500;white-space:nowrap}
.mob-tab[aria-current="page"] span{font-weight:600}
.mob-hbars{display:flex;align-items:flex-end;gap:2px;margin-top:14px}
.mob-hbars .hbar-pair{height:104px;gap:1px}
.mob-hbars .hbar-lbl{font-size:8px}

/* ---------- responsivo ---------- */
@media (max-width:1240px){
  .s3{grid-column:span 6}
  .s7,.s8{grid-column:span 12}
  .s4,.s5{grid-column:span 12}
  .det-sticky{position:static !important}
  .inv-head,.inv-row{grid-template-columns:1fr 118px 108px}
  .eq-head,.eq-row{grid-template-columns:24px minmax(0,1fr) 84px 76px 52px 28px;gap:10px}
}
@media (max-width:1040px){
  .rail{width:74px}
  .nav-label,.brand-text,.unitbox,.meter-rows,.meter-note,.meter-bar,.meter-lbl{display:none}
  .rail-foot{padding:0 10px}
  .meter{padding:10px;display:flex;justify-content:center}
  .brand{padding:0 20px 24px;justify-content:center}
  .nav-item{justify-content:center;padding:11px 0}
  .badge{position:absolute;transform:translate(14px,-12px)}
  .nav-item{position:relative}
  .page,.topbar{padding-left:20px;padding-right:20px}
  .seg .full{display:none}
  .seg .short{display:inline}
  .seg button{padding:6px 12px}
}
@media (max-width:900px){
  .eq-head,.eq-row{grid-template-columns:minmax(0,1fr) 76px 52px 28px}
  .eq-hide{display:none}
  .topbar h1{font-size:25px}
  .card{padding:18px 18px}
  .hero{padding:20px 20px 18px}
  .big-74{font-size:56px;letter-spacing:-2.4px}
  .inv-head,.inv-row{grid-template-columns:1fr 92px}
  .inv-q{display:none}
}
/* abaixo disso o app vira app de celular de verdade */
@media (max-width:760px){
  .desk{display:none !important}
  body.vista-celular{background:var(--ground)}
  .phone-stage{padding:0;min-height:100dvh;background:var(--ground)}
  .phone-back{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none;background:var(--ground)}
  .phone-screen{border-radius:0}
  .phone-island,.phone-home{display:none}
  .mob-head{padding-top:max(20px,env(safe-area-inset-top))}
  .mob-tabs{padding-bottom:max(10px,env(safe-area-inset-bottom))}
}
@media (min-width:761px){
  .mobile-only{display:none !important}
}

/* ---------- impressao ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .rail,.topbar,.toasts,.no-print,.mob-tabs{display:none !important}
  .app{display:block}
  .page{padding:0}
  .card{border-color:#D8D2C4;break-inside:avoid;box-shadow:none}
  .grid12{display:block}
  .s8,.s4{width:100%}
  .s4{margin-top:14px}
  .print-head{display:flex !important}
}
.print-head{display:none;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}


/* ============================================================

function diaDoAno(d) {

/* ---------- mês simulado (memoizado) ---------- */
const _cacheMes = new Map();
function mesSimulado(chave, y, m) {
  const ck = chave + '|' + y + '|' + m;
  if (_cacheMes.has(ck)) return _cacheMes.get(ck);
  const u = uni(chave), nd = diasNoMes(y, m);

  const sazG = 1 + 0.19 * Math.cos(2 * Math.PI * (m - 11) / 12);
  const sazC = 1 + 0.15 * Math.cos(2 * Math.PI * m / 12);
  const alvoG = u.geracaoMes * sazG, alvoC = u.consumoMes * sazC;

  const formaC = u.consumoH.slice(), somaFC = soma(formaC);
  const brutoG = [], brutoC = [], formasG = [];
  for (let i = 0; i < nd; i++) {
    const d = new Date(y, m, i + 1);
    formasG.push(formaSolar(d));
    brutoG.push(tempoDoDia(chave, d));
    const idx = Math.round(d.getTime() / 86400000);
    brutoC.push((0.87 + 0.27 * suave(chave + '|uso', idx, 3)) * u.semana[d.getDay()]);
  }
  const kG = alvoG / (soma(brutoG) || 1), kC = alvoC / (soma(brutoC) || 1);

  const dias = [];
  for (let i = 0; i < nd; i++) {
    const totG = brutoG[i] * kG, totC = brutoC[i] * kC;
    const ger = formasG[i].map(v => v * totG);
    const idx = Math.round(new Date(y, m, i + 1).getTime() / 86400000);
    let cons = formaC.map((v, hr) => (v / somaFC) * totC * (0.9 + 0.2 * ruido(chave + '|h' + idx + '_' + hr)));
    const kk = totC / (soma(cons) || 1);
    cons = cons.map(v => v * kk);
    let auto = 0, inj = 0, rede = 0;
    for (let hr = 0; hr < 24; hr++) {
      auto += Math.min(cons[hr], ger[hr]);
      inj += Math.max(0, ger[hr] - cons[hr]);
      rede += Math.max(0, cons[hr] - ger[hr]);
    }
    dias.push({ dia: i + 1, dow: new Date(y, m, i + 1).getDay(), cons: cons, ger: ger, tc: totC, tg: totG, auto: auto, inj: inj, rede: rede });
  }
  const r = {
    y: y, m: m, nd: nd, dias: dias,
    tc: soma(dias.map(d => d.tc)), tg: soma(dias.map(d => d.tg)),
    auto: soma(dias.map(d => d.auto)), inj: soma(dias.map(d => d.inj)), rede: soma(dias.map(d => d.rede))
  };
  _cacheMes.set(ck, r);
  return r;
}

/* soma parcial de um mês até "horas" decorridas */
function ate(md, horas) {
  const r = { tc: 0, tg: 0, auto: 0, inj: 0, rede: 0, dias: 0 };
  if (horas == null) horas = md.nd * 24;
  for (let i = 0; i < md.nd; i++) {
    const d = md.dias[i];
    const ini = i * 24;
    if (ini >= horas) break;
    const fim = Math.min(24, horas - ini);
    if (fim >= 24) { r.tc += d.tc; r.tg += d.tg; r.auto += d.auto; r.inj += d.inj; r.rede += d.rede; r.dias++; continue; }
    for (let hr = 0; hr < 24; hr++) {
      const f = clamp(fim - hr, 0, 1);
      if (f <= 0) break;
      const c = d.cons[hr] * f, g = d.ger[hr] * f;
      r.tc += c; r.tg += g;
      r.auto += Math.min(c, g); r.inj += Math.max(0, g - c); r.rede += Math.max(0, c - g);
    }
    r.dias += fim / 24;
  }
  return r;
}

/* data em que a unidade entrou em operação, deduzida dos meses de operação */
function inicioOperacao(chave) {
  const u = uni(chave), d = agora();
  return new Date(d.getFullYear(), d.getMonth() - (u.mesesOperacao - 1), 1);
}
function temDireitoAdquirido(chave) {
  return inicioOperacao(chave) <= CORTE_DIREITO_ADQUIRIDO;
}
/* Dois patamares diferentes, e a distinção importa:
   - potencial da região: o que um telhado ideal (voltado ao norte, sem sombra)
     entregaria com essa potência instalada;
   - esperado: o que ESTE telhado entrega, dada orientação e sombreamento.
   Comparar a geração real contra o esperado mede saúde operacional (sujeira,
   inversor, falha). Comparar contra o potencial mede qualidade da instalação. */
function potencialRegiao(chave, m, nd) {
  const u = uni(chave);
  return u.potenciaKwp * IRRADIACAO_SP[m] * RAZAO_DESEMPENHO * nd;
}
function geracaoEsperada(chave, m, nd) {
  return potencialRegiao(chave, m, nd) * uni(chave).fatorInstalacao;
}

/* ---------- livro de créditos: compensação mês a mês ---------- */
const _cacheLedger = new Map();
function ledger(chave, ate_y, ate_m, horasUltimo) {
  const ck = chave + '|' + ate_y + '|' + ate_m + '|' + (horasUltimo == null ? 'cheio' : Math.floor(horasUltimo));
  if (_cacheLedger.has(ck)) return _cacheLedger.get(ck);
  const u = uni(chave);
  const fim = ate_y * 12 + ate_m;
  const ini = fim - (u.mesesOperacao - 1);
  const adq = temDireitoAdquirido(chave);
  let creditos = 0, economiaTotal = 0, fioBTotal = 0;
  const linhas = [];
  for (let k = ini; k <= fim; k++) {
    const y = Math.floor(k / 12), m = k - y * 12;
    const md = mesSimulado(chave, y, m);
    const p = (k === fim) ? ate(md, horasUltimo) : ate(md, null);
    creditos += p.inj;
    /* o mínimo faturável (custo de disponibilidade) nunca é abatido por crédito */
    const usado = Math.min(creditos, Math.max(0, p.rede - u.minFatura));
    creditos -= usado;
    const faturado = p.rede - usado;

    /* Lei 14.300: paga-se Fio B sobre a energia compensada */
    const perc = percentualFioB(y, adq);
    const fioB = usado * u.fioB * perc;
    fioBTotal += fioB;

    /* economia real = energia que deixou de ser comprada, menos o Fio B */
    const economia = (p.auto + usado) * u.tarifa - fioB;
    economiaTotal += economia;

    linhas.push({
      y: y, m: m, k: k, cons: p.tc, ger: p.tg, auto: p.auto, inj: p.inj, rede: p.rede,
      usado: usado, faturado: faturado, fioB: fioB, percFioB: perc,
      economia: economia, creditos: creditos
    });
  }
  const r = { linhas: linhas, creditos: creditos, economiaTotal: economiaTotal, fioBTotal: fioBTotal, direitoAdquirido: adq };
  _cacheLedger.set(ck, r);
  return r;
}

/* Monta uma unidade completa a partir do que o usuário informou.
   O que dá para calcular, é calculado: geração vem da irradiação da região,
   da potência instalada e da condição do telhado — não se pergunta. */
function montarUnidade(f) {
  const a = ARQUETIPOS[f.arquetipo] || ARQUETIPOS.casaVazia;
  const telhado = TELHADOS.filter(t => t.k === f.telhado)[0] || TELHADOS[1];
  const irradiacaoMedia = soma(IRRADIACAO_SP) / 12;
  const geracaoMes = f.potenciaKwp * irradiacaoMedia * RAZAO_DESEMPENHO * telhado.fator * 30;

  return {
    chave: f.chave, propria: true, arquetipo: f.arquetipo,
    nome: f.nome, tipo: a.tipo + ' · ' + a.rotulo.toLowerCase(), curto: a.tipo,
    distribuidora: f.distribuidora || 'Não informada',
    tarifa: f.tarifa, tarifaComp: +(f.tarifa * 0.86).toFixed(3), fioB: +(f.tarifa * 0.28).toFixed(3),
    ilum: a.ilum, minFatura: a.minFatura,
    potenciaKwp: f.potenciaKwp, paineis: f.paineis, investimento: f.investimento,
    mesesOperacao: Math.max(1, f.mesesOperacao),
    fatorInstalacao: telhado.fator, condicaoTelhado: telhado.rotulo.toLowerCase(),
    consumoMes: f.consumoMes, geracaoMes: geracaoMes,
    metaPadrao: Math.round(f.consumoMes * 0.92),
    consumoH: a.consumoH.slice(), semana: a.semana.slice(), comodos: a.comodos.slice(),
    equipamentos: a.equipamentos.map(e => Object.assign({}, e, { fonte: 'ia' })),
    deteccoes: []
  };
}

function unidadesProprias() { return (S.unidades || []).map(montarUnidade); }

  if (UNIDADES_BASE[chave]) return UNIDADES_BASE[chave];

}

function tarifaAtual() { const u = unidade(); return S.tarifa[S.perfil] != null ? S.tarifa[S.perfil] : u.tarifa; }

function agora() { return new Date(); }
function horasDecorridas(d) { return (d.getDate() - 1) * 24 + d.getHours() + d.getMinutes() / 60; }

/* A desagregação sempre fecha com o medidor: os aparelhos da IA ocupam a fatia
   que lhes cabe da projeção do mês, os cadastrados à mão entram com o consumo
   informado, e o que sobra vira "Não identificado". */
function aparelhos() {
  const u = unidade(), t = tarifaAtual(), v = visao(), nd = v.nd;
  const nativos = u.equipamentos.filter(e => S.removidos.indexOf(S.perfil + ':' + e.id) < 0);
  const extras = S.extras.filter(e => e.perfil === S.perfil)
    .map(e => Object.assign({}, e, { kwh: (e.pot / 1000) * e.horas * e.dias }));

  const restante = Math.max(0, v.projConsumo - soma(extras.map(e => e.kwh)));
  const bruto = nativos.map(e => e.share * v.projConsumo);
  const somaBruto = soma(bruto);
  const k = somaBruto > 0 ? Math.min(1, restante / somaBruto) : 0;

  const lista = nativos.map((e, i) => {
    const kwh = bruto[i] * k;
    return Object.assign({}, e, {
      kwh: kwh, dias: nd,
      horas: e.pot > 0 ? (kwh * 1000) / (e.pot * nd) : 0
    });
  }).concat(extras);

  const nid = Math.max(0, restante - somaBruto * k);
  if (nid > 0.5) {
    lista.push({
      id: 'nid', nome: 'Não identificado', local: '—', cat: 'Outros', pot: 0, horas: 0, dias: 0,
      cor: '#C9C2B2', conf: 'baixa', fonte: 'ia', tend: 5, kwh: nid, sintetico: true
    });
  }
  lista.sort((a, b) => b.kwh - a.kwh);
  lista.forEach(e => { e.reais = e.kwh * t; });
  return lista;
}

/* quanto os aparelhos cadastrados à mão passam do que o medidor registra (0 = tudo certo) */
function extrasExcedem() {
  const s = soma(S.extras.filter(e => e.perfil === S.perfil).map(e => (e.pot / 1000) * e.horas * e.dias));
  const p = visao().projConsumo;
  return s > p ? s - p : 0;
}

let _visao = null, _visaoHora = -1;
function visao(forcar) {
  const d = agora();
  const marca = d.getFullYear() * 1e6 + d.getMonth() * 1e4 + d.getDate() * 100 + d.getHours();
  if (!forcar && _visao && _visaoHora === marca && _visao.perfil === S.perfil && _visao.tarifa === tarifaAtual()) return _visao;

  const u = unidade(), t = tarifaAtual();
  const y = d.getFullYear(), m = d.getMonth();
  const hDec = horasDecorridas(d);
  const md = mesSimulado(S.perfil, y, m);
  const mtd = ate(md, hDec);
  const cheio = ate(md, null);
  const lg = ledger(S.perfil, y, m, hDec);
  const atual = lg.linhas[lg.linhas.length - 1];
  const anteriores = lg.linhas.slice(0, -1);

  /* A projeção é o mês inteiro já simulado — o que passou mais o que falta.
     Extrapolar a média do que decorreu explodia no dia 1º, quando há
     poucas horas medidas para dividir. */
  const fracao = clamp(hDec / (md.nd * 24), 0.001, 1);
  const lgFim = ledger(S.perfil, y, m, null);
  const fim = lgFim.linhas[lgFim.linhas.length - 1];
  const projConsumo = cheio.tc;
  const projGeracao = cheio.tg;
  const projRede = cheio.rede;
  const projInj = cheio.inj;

  const economia = atual.economia;
  const economiaCheia = fim.economia;
  const anteriorEcon = anteriores.length ? anteriores[anteriores.length - 1].economia : economia;

  const bandeira = mtd.rede * 0.0189;
  const projUsado = fim.usado;
  const projFaturado = fim.faturado;
  const projFioB = fim.fioB;
  const contaProj = projFaturado * t + projRede * 0.0189 + u.ilum + projFioB;
  const semSolarProj = Math.max(projConsumo, u.minFatura) * t + projConsumo * 0.0189 + u.ilum;

  /* quanto o sistema entrega em relação ao que o telhado poderia entregar */
  const potencial = potencialRegiao(S.perfil, m, md.nd);
  const esperada = geracaoEsperada(S.perfil, m, md.nd);
  const desempenho = esperada > 0 ? (cheio.tg / esperada) * 100 : 0;
  const aproveitaTelhado = potencial > 0 ? (esperada / potencial) * 100 : 0;

  const autoPct = mtd.tc > 0 ? (mtd.auto / mtd.tc) * 100 : 0;
  const co2 = mtd.tg * 0.0861;

  _visao = {
    perfil: S.perfil, tarifa: t, data: d, y: y, m: m, nd: md.nd, hDec: hDec, fracao: fracao,
    md: md, mtd: mtd, cheio: cheio, ledger: lg, linhaAtual: atual, anteriores: anteriores,
    projConsumo: projConsumo, projGeracao: projGeracao, projRede: projRede, projInj: projInj,
    projUsado: projUsado, projFaturado: projFaturado, projFioB: projFioB,
    potencial: potencial, esperada: esperada, desempenho: desempenho, aproveitaTelhado: aproveitaTelhado,
    percFioB: fim.percFioB, direitoAdquirido: lg.direitoAdquirido, fioBTotal: lg.fioBTotal,
    economia: economia, economiaCheia: economiaCheia, anteriorEcon: anteriorEcon,
    creditos: lg.creditos, economiaTotal: lg.economiaTotal,
    bandeira: bandeira, contaProj: contaProj, semSolarProj: semSolarProj,
    autoPct: autoPct, co2: co2
  };
  _visaoHora = marca;
  return _visao;
}

/* potência instantânea — interpola a curva do dia e treme um pouco.
   De vez em quando um aparelho pesado liga: é o surto. */
let _jitterC = 1, _jitterG = 1, _surto = 0;
function surtoAtivo() { return _surto > 0; }
function pulso() {
  if (_surto > 0) _surto--;
  else if (Math.random() < 0.014) _surto = 5 + Math.floor(Math.random() * 7);
  const alvo = _surto > 0 ? 1.9 + Math.random() * 0.5 : 1;
  _jitterC = clamp(_jitterC + (alvo - _jitterC) * 0.38 + (Math.random() - 0.5) * 0.07, 0.82, 2.5);
  _jitterG = clamp(_jitterG + (Math.random() - 0.5) * 0.06, 0.9, 1.08);
}
function potenciaAgora() {
  const d = agora(), v = visao();
  const dia = v.md.dias[Math.min(d.getDate() - 1, v.md.nd - 1)];
  const hr = d.getHours(), f = d.getMinutes() / 60;
  const lerp = arr => arr[hr] * (1 - f) + arr[Math.min(23, hr + 1)] * f;
  let c = Math.max(0.02, lerp(dia.cons) * _jitterC);
  const g = Math.max(0, lerp(dia.ger) * _jitterG);

  /* Com o medidor físico ligado, o consumo passa a ser leitura real.
     Um sensor só no quadro geral não separa geração — ela segue simulada.
     Ver docs/contrato-dados.md. */
  if (MEDIDOR.ativo && MEDIDOR.ultima != null && (Date.now() - MEDIDOR.quando) < MEDIDOR.limiteMs) {
    c = MEDIDOR.ultima;
  }
  return { cons: c, ger: g, rede: Math.max(0, c - g), inj: Math.max(0, g - c), hora: hr + f };
}

/* ---------- fonte da leitura ---------- */
const MEDIDOR = {
  ativo: false, endereco: '192.168.4.1', ultima: null, quando: 0,
  limiteMs: 15000, erro: null, buscando: false
};
function fonteAtual() {
  if (!MEDIDOR.ativo) return 'simulado';
  const fresca = MEDIDOR.ultima != null && (Date.now() - MEDIDOR.quando) < MEDIDOR.limiteMs;
  return fresca ? 'medidor' : 'aguardando';
}
/* Busca a leitura do ESP32. Nunca lança: se a rede cair, o app
   simplesmente volta a mostrar o simulado. */
function buscarMedidor() {
  if (!MEDIDOR.ativo || MEDIDOR.buscando || typeof fetch !== 'function') return;
  MEDIDOR.buscando = true;
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  if (ctrl) setTimeout(() => ctrl.abort(), 3000);
  fetch('http://' + MEDIDOR.endereco + '/leitura', { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
    .then(r => r.json())
    .then(j => {
      const kw = Number(j && j.cons);
      if (isFinite(kw) && kw >= 0) { MEDIDOR.ultima = kw; MEDIDOR.quando = Date.now(); MEDIDOR.erro = null; }
    })
    .catch(e => { MEDIDOR.erro = String(e && e.message || e); })
    .then(() => { MEDIDOR.buscando = false; });
}

/* série do período selecionado */
function seriePeriodo() {
  const v = visao(), d = v.data;
  if (S.periodo === 'dia') {
    const dia = v.md.dias[d.getDate() - 1];
    const ha = Math.max(1, Math.ceil(v.hDec - (d.getDate() - 1) * 24));
    return {
      rotulo: 'Hoje, hora a hora', unidade: 'hora',
      cons: dia.cons.slice(0, ha), ger: dia.ger.slice(0, ha),
      rede: soma(dia.cons.slice(0, ha).map((c, i) => Math.max(0, c - dia.ger[i]))),
      labels: dia.cons.slice(0, ha).map((_, i) => i % 3 === 0 ? String(i).padStart(2, '0') + 'h' : ''),
      nomes: dia.cons.map((_, i) => String(i).padStart(2, '0') + 'h'),
      anterior: (() => { const p = new Date(d); p.setDate(d.getDate() - 1); const pm = mesSimulado(S.perfil, p.getFullYear(), p.getMonth()); const pd = pm.dias[p.getDate() - 1]; const n = Math.max(1, ha); return { c: soma(pd.cons.slice(0, n)), g: soma(pd.ger.slice(0, n)) }; })()
    };
  }
  if (S.periodo === 'semana') {
    const cons = [], ger = [], labels = [], nomes = [];
    let ac = 0, ag = 0, redeTot = 0;
    for (let i = 6; i >= 0; i--) {
      const dd = new Date(d); dd.setDate(d.getDate() - i);
      const mm = mesSimulado(S.perfil, dd.getFullYear(), dd.getMonth());
      const dia = mm.dias[dd.getDate() - 1];
      const parcial = i === 0 ? (d.getHours() + d.getMinutes() / 60) : 24;
      let c = 0, g = 0;
      for (let hr = 0; hr < 24; hr++) {
        const f = clamp(parcial - hr, 0, 1);
        c += dia.cons[hr] * f; g += dia.ger[hr] * f;
        redeTot += Math.max(0, dia.cons[hr] - dia.ger[hr]) * f;
      }
      cons.push(c); ger.push(g);
      labels.push(DIA3[dd.getDay()]); nomes.push(DIAF[dd.getDay()] + ', ' + dd.getDate() + '/' + (dd.getMonth() + 1));
      const pd = new Date(dd); pd.setDate(dd.getDate() - 7);
      const pm = mesSimulado(S.perfil, pd.getFullYear(), pd.getMonth());
      const pdia = pm.dias[pd.getDate() - 1];
      ac += pdia.tc; ag += pdia.tg;
    }
    return { rotulo: 'Últimos 7 dias', unidade: 'dia', cons: cons, ger: ger, rede: redeTot, labels: labels, nomes: nomes, anterior: { c: ac, g: ag } };
  }
  const nDias = Math.ceil(v.hDec / 24);
  const cons = [], ger = [], labels = [], nomes = [];
  for (let i = 0; i < nDias; i++) {
    const dia = v.md.dias[i];
    const parcial = i === nDias - 1 ? (v.hDec - i * 24) : 24;
    let c = 0, g = 0;
    for (let hr = 0; hr < 24; hr++) { const f = clamp(parcial - hr, 0, 1); c += dia.cons[hr] * f; g += dia.ger[hr] * f; }
    cons.push(c); ger.push(g);
    labels.push((i + 1) % 5 === 0 || i === 0 ? String(i + 1) : '');
    nomes.push(dia.dia + ' de ' + MESES[v.m]);
  }
  const pk = v.y * 12 + v.m - 1, py = Math.floor(pk / 12), pm2 = pk - py * 12;
  const ant = ate(mesSimulado(S.perfil, py, pm2), Math.min(v.hDec, diasNoMes(py, pm2) * 24));
  return { rotulo: MESES[v.m].charAt(0).toUpperCase() + MESES[v.m].slice(1) + ', dia a dia', unidade: 'dia', cons: cons, ger: ger, rede: v.mtd.rede, labels: labels, nomes: nomes, anterior: { c: ant.tc, g: ant.tg } };
}

/* caminho SVG */
function caminho(vals, max, w, hh, fechar) {
  const n = vals.length; if (n < 2) return '';
  const passo = w / (n - 1);
  let d = '';
  vals.forEach((v, i) => {
    const x = +(i * passo).toFixed(1), y = +(hh - (v / max) * hh).toFixed(1);
    d += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
  });
  if (fechar) d += 'L' + w + ' ' + hh + ' L0 ' + hh + ' Z';
  return d.trim();
}

  }

  }

  }

  /* dispensar vale pelo dia: amanhã o alerta volta se a situação continuar */
  return out.map(a => Object.assign(a, { chave: chaveDispensa(a.id) }))

/* ===== login.js ===== */
/* ============================================================
   SOLARIS — contas e sessão

   HONESTIDADE SOBRE O QUE ISTO É:
   O Solaris roda de um arquivo, sem servidor. Então este login NÃO é
   segurança contra alguém com acesso ao computador — quem abrir o DevTools
   lê o armazenamento local. O que ele entrega de verdade:

     - a senha nunca é guardada, nem em texto nem reversível;
     - deriva-se uma chave com salt aleatório e muitas iterações, então
       descobrir a senha a partir do que está salvo é caro;
     - cada conta tem seus próprios dados: unidades, aparelhos, metas e
       tarifas não vazam de uma para outra no mesmo navegador.

   Num produto real a verificação aconteceria no servidor, e o hash nunca
   sairia de lá. Isso está dito na própria tela de login, de propósito.

   O login NÃO bloqueia o acesso: o site abre direto no painel, em modo
   visitante. Criar conta é opcional e serve para separar dados de quem
   divide o mesmo navegador. Virar app com conta obrigatória é assunto
   de uma fase futura do projeto.
   ============================================================ */
'use strict';

const CHAVE_CONTAS = 'solaris.contas.v1';
const CHAVE_SESSAO = 'solaris.sessao.v1';
const ITERACOES = 150000;
const DIAS_SESSAO = 30;

/* ---------- utilidades de bytes ---------- */
function bytesParaHex(buf) {
  return Array.prototype.map.call(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}
function saltAleatorio() {
  const a = new Uint8Array(16);
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256);
  return bytesParaHex(a);
}

/* ---------- SHA-256 em JS puro ----------
   Existe porque crypto.subtle só funciona em contexto seguro, e o app
   precisa abrir de file:// em qualquer máquina. Quando o WebCrypto está
   disponível usamos ele (mais rápido e mais correto); senão, este.        */
function sha256(msg) {
  const K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  let H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

  const bytes = [];
  for (let i = 0; i < msg.length; i++) {
    let c = msg.charCodeAt(i);
    if (c < 128) bytes.push(c);
    else if (c < 2048) bytes.push(192 | c >> 6, 128 | c & 63);
    else bytes.push(224 | c >> 12, 128 | (c >> 6) & 63, 128 | c & 63);
  }
  const bits = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push((i < 4 ? Math.floor(bits / Math.pow(2, i * 8)) : 0) & 0xff);

  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const w = new Array(64);
  for (let bloco = 0; bloco < bytes.length; bloco += 64) {
    for (let i = 0; i < 16; i++) {
      w[i] = (bytes[bloco + i * 4] << 24) | (bytes[bloco + i * 4 + 1] << 16) |
        (bytes[bloco + i * 4 + 2] << 8) | bytes[bloco + i * 4 + 3];
    }
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a | 0, H[1] + b | 0, H[2] + c | 0, H[3] + d | 0,
    H[4] + e | 0, H[5] + f | 0, H[6] + g | 0, H[7] + h | 0];
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

/* ---------- derivação da chave ---------- */
const TEM_WEBCRYPTO = typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder === 'function';

async function derivarWebCrypto(senha, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: ITERACOES, hash: 'SHA-256' }, base, 256);
  return bytesParaHex(bits);
}
/* fallback: SHA-256 encadeado. Menos robusto que PBKDF2-HMAC, mas ainda
   é uma função lenta com salt — não é a senha guardada em texto. */
function derivarJS(senha, salt) {
  let h = sha256(salt + '|' + senha);
  const voltas = Math.round(ITERACOES / 60);
  for (let i = 0; i < voltas; i++) h = sha256(h + salt);
  return h;
}
async function derivar(senha, salt, metodo) {
  const m = metodo || (TEM_WEBCRYPTO ? 'pbkdf2' : 'sha256x');
  const valor = m === 'pbkdf2' ? await derivarWebCrypto(senha, salt) : derivarJS(senha, salt);
  return { metodo: m, valor: valor };
}
/* comparação em tempo constante, para não vazar por quanto tempo demora */
function iguaisSeguro(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}

/* ---------- operações de conta ---------- */
async function criarConta(nome, email, senha) {
  const e = normalizarEmail(email);
  if (String(nome).trim().length < 2) throw new Error('Escreva seu nome com pelo menos 2 letras.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) throw new Error('Esse e-mail não parece válido.');
  if (String(senha).length < 6) throw new Error('A senha precisa de pelo menos 6 caracteres.');
  const todas = contas();
  if (todas[e]) throw new Error('Já existe uma conta com esse e-mail neste navegador.');

  const salt = saltAleatorio();
  const d = await derivar(senha, salt);
  todas[e] = {
    id: e, nome: String(nome).trim(), email: e,
    salt: salt, hash: d.valor, metodo: d.metodo, criadoEm: Date.now()
  };
  if (!gravarJSON(CHAVE_CONTAS, todas)) throw new Error('Este navegador bloqueou o armazenamento local. Saia do modo anônimo e tente de novo.');
  return todas[e];
}

async function entrar(email, senha, manter) {
  const e = normalizarEmail(email);
  const c = contas()[e];
  /* mesmo sem conta, derivamos uma vez: assim o tempo de resposta não
     revela se o e-mail existe */
  const alvo = c || { salt: 'inexistente', hash: '', metodo: TEM_WEBCRYPTO ? 'pbkdf2' : 'sha256x' };
  const d = await derivar(senha, alvo.salt, alvo.metodo);
  if (!c || !iguaisSeguro(d.valor, c.hash)) throw new Error('E-mail ou senha não conferem.');

  SESSAO = {
    id: c.id, nome: c.nome, email: c.email,
    ate: manter ? Date.now() + DIAS_SESSAO * 86400000 : null
  };
  gravarJSON(CHAVE_SESSAO, SESSAO);
  return SESSAO;
}

function entrarComoVisitante() {
  SESSAO = { id: 'visitante', nome: 'Visitante', email: null, ate: null };
  gravarJSON(CHAVE_SESSAO, SESSAO);
  return SESSAO;
}

function sair() {
  SESSAO = null;
  try { localStorage.removeItem(CHAVE_SESSAO); } catch (e) { }
}

async function trocarSenha(senhaAtual, senhaNova) {
  if (!SESSAO || ehVisitante()) throw new Error('Entre com uma conta para trocar a senha.');
  const todas = contas(), c = todas[SESSAO.id];
  if (!c) throw new Error('Conta não encontrada.');
  const atual = await derivar(senhaAtual, c.salt, c.metodo);
  if (!iguaisSeguro(atual.valor, c.hash)) throw new Error('A senha atual não confere.');
  if (String(senhaNova).length < 6) throw new Error('A nova senha precisa de pelo menos 6 caracteres.');
  const salt = saltAleatorio();
  const d = await derivar(senhaNova, salt);
  c.salt = salt; c.hash = d.valor; c.metodo = d.metodo;
  gravarJSON(CHAVE_CONTAS, todas);
}

function apagarConta() {
  if (!SESSAO || ehVisitante()) return;
  const todas = contas();
  delete todas[SESSAO.id];
  gravarJSON(CHAVE_CONTAS, todas);
  try { localStorage.removeItem('solaris.v2.' + SESSAO.id); } catch (e) { }
  sair();
}

/* ---------- migração de dados ----------
   Dois casos em que os dados ficariam órfãos e o usuário acharia que
   perdeu tudo. Os dois são resolvidos calados. */

/* antes de existir login, o estado morava na chave sem sufixo */
function adotarDadosAntigos() {
  try {
    const antigo = localStorage.getItem(CHAVE_LS);
    const alvo = CHAVE_LS + '.visitante';
    if (antigo && !localStorage.getItem(alvo)) localStorage.setItem(alvo, antigo);
  } catch (e) { }
}

/* quem brincou como visitante e depois criou conta leva o que fez junto */
function migrarDoVisitante(destinoId) {
  try {
    const origem = CHAVE_LS + '.visitante';
    const destino = CHAVE_LS + '.' + destinoId;
    const dados = localStorage.getItem(origem);
    if (!dados || localStorage.getItem(destino)) return false;
    localStorage.setItem(destino, dados);
    localStorage.removeItem(origem);
    return true;
  } catch (e) { return false; }
}

/* envio do formulário */
async function enviarLogin(ev) {
  ev.preventDefault();
  if (ocupado) return;
  const criar = modoLogin === 'criar';
  const nome = criar ? ($('#auNome') || {}).value : '';
  const email = ($('#auEmail') || {}).value;
  const senha = ($('#auSenha') || {}).value;
  const manter = criar ? true : !!(($('#auManter') || {}).checked);

  ocupado = true; erroLogin = ''; renderLogin();
  try {
    let migrou = false;
    if (criar) {
      const c = await criarConta(nome, email, senha);
      migrou = ehVisitante() && migrarDoVisitante(c.id);
      await entrar(email, senha, true);
    } else await entrar(email, senha, manter);
    ocupado = false;
    aoEntrar(migrou);
  } catch (e) {
    ocupado = false;
    erroLogin = e.message || 'Não deu para continuar.';
    renderLogin();
    const alvo = $('#auSenha'); if (alvo) { alvo.focus(); alvo.select(); }
  }
}

function renderLogin() {
  const root = $('#root');
  const foco = document.activeElement ? document.activeElement.id : null;
  const vals = {};
  ['auNome', 'auEmail', 'auSenha'].forEach(id => { const e = $('#' + id); if (e) vals[id] = e.value; });

  root.innerHTML = vLogin();
  document.body.classList.remove('vista-celular');
  document.body.classList.add('vista-login');

  Object.keys(vals).forEach(id => { const e = $('#' + id); if (e && id !== 'auSenha') e.value = vals[id]; });
  const f = $('#formLogin');
  if (f) f.addEventListener('submit', enviarLogin);
  /* foco pode ser '' quando o elemento ativo é o body — '#' sozinho não é seletor válido */
  const alvo = (foco && $('#' + foco)) || $('#auNome') || $('#auEmail');
  if (alvo && !ocupado) alvo.focus();
}

  if (p.ger <= 0.02) return 'Painéis dormindo. Tudo vem da rede.';
  if (p.inj > 0.05) return 'Sobrando ' + nf(p.inj, 2) + ' kW para a rede — virando crédito.';
  return 'O sol cobre ' + pct((p.ger / Math.max(p.cons, .001)) * 100) + ' do que a casa puxa agora.';
}
